/* A column, so the footer button can be pushed to the floor of the panel rather than
   trailing the last row — Taif's call, 25 Sep. It matters more since the five-row floor:
   a panel with two rows has a lot of slack under them, and a button sitting in the middle
   of it looked like a third row that had lost its text. */
.hpanel{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);
  padding:14px 6px 10px;min-height:calc(14px + 38px + 4px + 5*60px + 10px);
  display:flex;flex-direction:column}
.hpanel h2{font-family:var(--serif);font-size:19px;font-weight:400;padding:0 12px 8px;color:var(--ink)}
/* the widget header carries the add button, and a rule that separates it from the rows */
.hph-row{display:flex;align-items:center;gap:10px;padding:0 12px 9px;margin-bottom:4px;
  border-bottom:1px solid var(--line)}
.hph-row h2{flex:1;min-width:0;padding:0}
.hadd{width:28px;height:28px;flex:none;border-radius:999px;display:grid;place-items:center;
  color:var(--ink-2);border:1px solid var(--line-2);background:var(--surface)}
.hadd:hover{background:var(--surface-2);color:var(--ink);border-color:var(--signal)}
.hadd:active{transform:translateY(1px)}
.htask.newt{align-items:center}
.htask.newt .bx{border-style:dashed;background:none}
.tnew{min-width:0;width:100%;height:28px;border:none;border-bottom:1.5px solid var(--line-2);
  background:none;font:inherit;font-size:13px;color:var(--ink);padding:0 2px}
.tnew:focus{outline:none;border-bottom-color:var(--signal)}
.tnew::placeholder{color:var(--faint)}
.tadd{flex:none;font-size:11.5px;font-weight:600;color:var(--signal);padding:3px 6px;
  margin:0 -6px 0 0;border-radius:6px;white-space:nowrap}
.tadd:hover{background:var(--signal-soft)}
/* the row itself is not a control — only the tick box and the priority tag are */
.htask{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;width:100%;
  text-align:left;padding:11px 12px}
.htask + .htask{border-top:1px solid var(--line)}
.htask .bx{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);margin-top:1px;
  display:grid;place-items:center;color:transparent;flex:none}
.htask .bx:hover{border-color:var(--good)}
.htask.done .bx{background:var(--good);border-color:var(--good);color:#fff}
.htask.done .tt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.htask.done .pr{opacity:.6}
.htask .tx{min-width:0}
.htask .tt{font-size:13px;color:var(--ink);display:block;
  text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}
.htask .du{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.htask .du.soon{color:var(--signal)}
/* the tag is the control: plain coloured text, so the colour carries the level */
.htask .pr{display:inline-flex;align-items:center;gap:4px;flex:none;white-space:nowrap;
  font-size:11.5px;font-weight:600;padding:3px 6px;margin:-2px -6px 0 0;border-radius:6px;
  background:none;color:var(--muted)}
.htask .pr:hover{background:var(--surface-2)}
.htask .pr .prc{color:var(--muted);flex:none}
.pr.p-hi{color:var(--signal)} .pr.p-md{color:var(--warn)} .pr.p-lo{color:var(--muted)}
.prdot{width:8px;height:8px;border-radius:999px;flex:none;display:block}
.prdot.p-hi{background:var(--signal)} .prdot.p-md{background:var(--warn)}
.prdot.p-lo{background:var(--muted)}
.htask-detail{font-size:12px;color:var(--ink-2);line-height:1.55;padding:0 12px 10px 51px;max-width:64ch}
/* Favoritter wears Oppgaver's row: the same three-column grid, the same paddings, the
   same hairline between rows, and two lines of text in the middle. What differs is the
   left control — a filled star that removes the favourite, where a task has a tick box —
   and a static type tag on the right where a task has its priority dropdown. */
.hfav{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;width:100%;
  text-align:left;padding:11px 12px}
.hfav + .hfav{border-top:1px solid var(--line)}
/* the star is always "on" here — every row in this list is already a favourite, so the
   only thing it can do is take it away. Signal red is right: this is destructive. */
.hfav .fstar-w{width:17px;height:17px;margin-top:1px;display:grid;place-items:center;
  color:var(--signal);flex:none;border-radius:5px}
.hfav .fstar-w svg{width:15px;height:15px;fill:currentColor}
.hfav .fstar-w:hover{background:var(--signal-soft)}
/* the text column is the button: the whole of it opens the resource, and it carries the
   same faint underline the task title does, so "this is a way in" reads the same in both */
.hfav .fx{min-width:0;text-align:left;display:block;background:none;padding:0}
.hfav .fnm{font-size:13px;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line-2);
  text-underline-offset:2px}
.hfav .fx:hover .fnm{text-decoration-color:var(--muted)}
.hfav .fsb{font-size:11.5px;color:var(--muted);display:block;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* same slot, same size and weight as .htask .pr, minus the control affordances */
.hfav .fty{flex:none;white-space:nowrap;font-size:11.5px;font-weight:600;padding:3px 6px;
  margin:-2px -6px 0 0;color:var(--muted)}
/* `auto` in the top slot takes the slack above the button, which is what sticks it to the
   floor of the panel. It has to live in the shorthand, not before it — a margin-top:auto
   declared earlier is overwritten by the shorthand that follows. The gap above the label
   is padding rather than margin, because `auto` resolves to 0 when the panel is already
   full and the button would otherwise sit flush against the last row. */
.hpanel .more{display:block;width:calc(100% - 24px);text-align:left;white-space:nowrap;
  margin:auto 12px 0;font-size:12.5px;color:var(--muted);padding:10px 0 6px}
.hpanel .more:hover{color:var(--ink)}

/* ============ Traditional concept: top bar and its two dropdowns =================
   No side menu. The burger holds the app-level destinations and the modules; a second
   pill appears beside it once you are inside a module and holds that module's own
   contents. Below the bar sits the same #page node the other concepts render into. */
.tshell{min-height:100vh;display:flex;flex-direction:column}
.tshell[hidden]{display:none}
body.traditional .shell{display:none}
body.traditional .bottombar{display:none}
body.traditional{padding-bottom:0}
.ttop{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;height:58px;
  padding:0 18px;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.ttop .sp{flex:1}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:58px}
/* borderless: on the top bar the fill alone marks the control. Hairlines are for widgets
   on the page — the cards — not for the chrome around them. */
.tburger{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:none;
  background:var(--surface);color:var(--ink-2);
  transition:background .14s,color .14s}
.tburger:hover,.tburger[aria-expanded="true"]{background:var(--surface-3);color:var(--ink)}
/* the same pill as the company switcher, because it is the same kind of thing: the scope
   you are working inside. It exists only while you are inside a module. */
.tmodbtn{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px 0 15px;border-radius:999px;
  background:var(--surface);color:var(--ink);font-size:13.5px;
  white-space:nowrap;flex:none;transition:background .14s}
.tmodbtn:hover,.tmodbtn[aria-expanded="true"]{background:var(--surface-3)}
.tmodbtn svg{color:var(--faint)}
.tmodbtn[hidden]{display:none}

/* both dropdowns share the sidebar overflow menus' surface */
.tmenu,.tsub{position:fixed;z-index:60;min-width:252px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;
  max-height:min(560px,76vh);overflow-y:auto}
.tsub{z-index:61;min-width:236px}
.tmenu[hidden],.tsub[hidden]{display:none}
.tmenu-lab{font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);padding:9px 11px 8px}
.tmenu hr,.tsub hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
.tmrow{display:flex;align-items:center;gap:11px;width:100%;height:38px;padding:0 11px;
  border-radius:9px;color:var(--ink-2);font-size:13.5px;text-align:left;flex:none}
.tmrow:hover,.tmrow[aria-expanded="true"]{background:var(--surface-2);color:var(--ink)}
.tmrow.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tmico{flex:none;display:grid;place-items:center;color:var(--ink-2);width:17px}
.tmrow.active .tmico{color:var(--accent)}
.tmlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmwhen{font-size:11.5px;color:var(--muted);flex:none;padding-left:12px}
.tmrow.active .tmwhen{color:var(--accent)}
.tmcaret{color:var(--faint);flex:none;display:grid;place-items:center}
.tmrow[aria-expanded="true"] .tmcaret{color:var(--ink-2)}
/* A favourite row in Traditional carries three actions that appear on hover. They are
   siblings of the row button rather than children of it — a button inside a button is
   invalid and the inner one does not reliably receive its own click.
   The wrapper takes the hover and active background so the row and its actions light up
   as one strip; the row's own backgrounds are neutralised inside it (these selectors are
   one class more specific than the .tmrow rules above, so no !important is needed).
   The actions are always in flow and only visibility-toggled. display:none made the menu
   jump wider the moment a row was hovered: the box is shrink-to-fit, so appearing buttons
   simply widened it. Reserving the space keeps the width constant, the label truncates
   into whatever is left, and visibility:hidden keeps the buttons out of the tab order and
   off the accessibility tree until they are shown. */
/* A favourited category in Traditional's menu: the same row metrics as everything else
   in there, plus a chevron that turns, and its contents on a recessed fill when open —
   the shape Menu-less's panel uses, in this menu's own language rather than the panel's.
   Its rows carry no hover actions: an item is in the list because its category is
   favourited, so there is no individual favourite to take away. */
.tmcat .tmcv{color:var(--faint);display:grid;place-items:center;flex:none;width:12px;
  transition:transform .15s}
.tmcat[aria-expanded="true"] .tmcv{transform:rotate(90deg)}
.tmcat .tmwhen{font-variant-numeric:tabular-nums}
.tmcatlist{background:var(--surface-2);border-radius:9px;padding:2px 0;margin:2px 0}
.tmcatlist .tmrow{padding-left:34px}
.tmcatlist .tmrow:hover{background:var(--surface-3)}
/* The empty favourites menu in Traditional. Not the one-line .favempty the panel uses:
   there is nothing in this list until the person puts something in it, so the empty
   state has to say what to do rather than report that nothing is there. The button
   underneath is the way to do it and was already on the menu — Taif's design, 1 Oct. */
.tmempty{display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:13px;padding:26px 20px 20px;color:var(--ink-2)}
.tmempty .ic{display:grid;place-items:center;color:var(--ink-2)}
.tmempty p{margin:0;font-size:13.5px;line-height:1.55;max-width:228px}
.tmrowwrap{display:flex;align-items:center;border-radius:9px}
.tmrowwrap:hover{background:var(--surface-2)}
.tmrowwrap.active,.tmrowwrap.active:hover{background:var(--accent-soft)}
.tmrowwrap .tmrow{flex:1;min-width:0;width:auto}
.tmrowwrap .tmrow:hover,.tmrowwrap .tmrow.active{background:none}
.tmacts{display:flex;align-items:center;gap:1px;padding-right:5px;flex:none;visibility:hidden}
/* focus-within, so the actions are reachable by keyboard: tabbing onto the row reveals
   them, and they are only in the tab order once revealed */
.tmrowwrap:hover .tmacts,.tmrowwrap:focus-within .tmacts{visibility:visible}
/* and a ceiling on the favourites menu, so a long resource name truncates rather than
   stretching the menu across the screen. Only this menu: the burger and the module menus
   carry page names that are better off not being cut. */
.tmenu[data-for="res"]{max-width:min(380px,92vw)}

/* ---- One height for everything in a top bar --------------------------------------
   Taif's call, 28 Sep. The three bars had grown a control at a time and every one had
   picked up its own number: burger and bell 40, the company pill 36, the wordmark 36,
   the profile disc 32, the search field 46 in Menu-less and 38 in Hybrid. Nothing was
   badly wrong on its own; together they made a row that looked unaligned, because
   centring six things of six heights leaves six different gaps above and below them.
   40px, not the average: it is what the icon buttons already were, and the file's own
   note beside .iconbtn calls 40x40 the house hit-area goal, so levelling upward keeps
   that promise instead of quietly breaking it for the smaller controls.
   Scoped to the three bars rather than to the components, because .iconbtn, .orgbtn and
   .searchbtn are used elsewhere at sizes that belong to where they are.
   The divider (.tvrule) is left at 20px — it is not a control, and a rule as tall as the
   things it separates would read as a wall. */
.ttop .tburger,.ttop .tmodbtn,.ttop .orgbtn,.ttop .iconbtn,
.mtop .mbrand,.mtop .orgbtn,.mtop .iconbtn,.mtop .mprofile,.mtop .searchbtn,
.htop .orgbtn,.htop .iconbtn,.htop .searchbtn{height:40px}
.ttop .tburger,.ttop .iconbtn,.mtop .iconbtn,.mtop .mprofile,.htop .iconbtn{width:40px}
/* the disc grew by 8px, so the initials grow with it rather than sitting small in it */
.mtop .mprofile{font-size:13px}

/* ---- Corner radius: Geometric ---------------------------------------------------
   A rig switch, 25 Sep. Organic is the file as written — 139 border-radius declarations,
   from the 999px pills to the 7px row actions. Geometric is all of them at zero.
   One blunt rule rather than a second value for every component: the point is to see the
   same layout with a different corner language, and a variant that had to be maintained
   declaration by declaration would drift out of step the first time anything new was
   added. !important because it has to beat 139 rules of every specificity, including any
   written later.
   .rig is excluded — the facilitator's panel is not part of any concept, and a control
   surface that changes shape while you are using it to change shapes is noise. */
body.geo *:not(.rig):not(.rig *){border-radius:0 !important}
.tmact{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  color:var(--ink-2);flex:none}
.tmact:hover{background:var(--surface-3);color:var(--ink)}
.tmrowwrap.active .tmact{color:var(--accent)}
/* the profile sits on the floor of the burger the way it sits on the floor of Hybrid's
   sidebar — same disc, same initials, same row height */
.tprofile{display:flex;align-items:center;gap:10px;padding:9px 11px;color:var(--ink-2);font-size:13px}
.tprofile .av{width:28px;height:28px;border-radius:999px;background:var(--surface-2);flex:none;
  display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-2);overflow:hidden}
.tprofile .av img{width:100%;height:100%;object-fit:cover;display:block}

/* ---- Traditional's bottom bar --------------------------------------------------
   Same surface and blur as the Tailored bar it is modelled on. Lives inside #tshell so
   it hides with the concept, even though it is position:fixed. ------------------- */
.tbottom{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:8px 18px calc(8px + env(safe-area-inset-bottom,0px));
  /* no surface and no edge of its own — the bar is the page floor, and the tabs are the
     objects standing on it. Opaque rather than transparent so content scrolling underneath
     does not show through. */
  background:var(--ground)}
/* display:flex would beat the [hidden] default of display:none, and the bar is now a
   top-level node with nothing hiding it for us */
.tbottom[hidden]{display:none}
/* the one filled pill on the bar, carrying the weight the Favoritter pill carries in
   the Tailored one — it is the way back to everything you can open */
.tresbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 15px;border-radius:999px;
  flex:none;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:450}
.tresbtn:hover,.tresbtn[aria-expanded="true"]{opacity:.92}
.tresbtn svg{opacity:.65}
/* the star carries meaning, the caret is furniture — so the star sits a step brighter than
   the .65 the caret takes. The count rides inside the label so it keeps a normal word
   space, and is quieter than the word it follows. */
.tresbtn .tstar{display:grid;place-items:center;flex:none}
.tresbtn .tstar svg{opacity:.9}
.tresbtn .tcount{opacity:.72;font-variant-numeric:tabular-nums}
/* secondary to it: same height and radius, quiet fill, no edge */
.toppbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 15px;border-radius:999px;
  flex:none;background:var(--surface);color:var(--ink-2);font-size:13px;
  transition:background .14s,color .14s}
/* display:flex beats [hidden]'s default, so the attribute needs saying out loud */
.toppbtn[hidden]{display:none}
.toppbtn:hover{background:var(--surface-2);color:var(--ink)}
.toppbtn[aria-expanded="true"]{background:var(--surface-3);color:var(--ink)}
.toppbtn svg{color:var(--faint)}
.tvrule{width:1px;height:20px;background:var(--line-2);flex:none}
.ttabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0;min-width:0}
.ttabs::-webkit-scrollbar{display:none}
/* a tab is the page plus its own menu, so it is a shell holding two buttons. It carries
   a fill and no edge: edges belong to the widgets on the page, not to the chrome. Which
   tab is on screen is carried by the label — --ink-2 at 6.67:1 for the others, --accent
   at 12.67:1 for this one — with the accent-soft fill backing it up. */
.ttab{display:flex;align-items:center;gap:2px;height:32px;padding:0 4px 0 11px;border-radius:9px;
  flex:none;max-width:250px;background:var(--surface);
  color:var(--ink-2);transition:background .14s,color .14s}
.ttab:hover{background:var(--surface-3);color:var(--ink)}
.ttab.cur,.ttab.cur:hover{background:var(--accent-soft);
  color:var(--accent);font-weight:500}
.ttab-go{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px;color:inherit;text-align:left}
.ttab-more{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  color:var(--faint);flex:none}
.ttab:hover .ttab-more{color:var(--ink-2)}
.ttab.cur .ttab-more{color:var(--accent);opacity:.7}
.ttab-more:hover,.ttab-more[aria-expanded="true"]{background:var(--surface-3);color:var(--ink)}
.ttab.cur .ttab-more:hover,.ttab.cur .ttab-more[aria-expanded="true"]{
  background:var(--surface);color:var(--accent);opacity:1}
.ttab-more svg{width:13px;height:13px}
.tnoopen{font-size:12px;color:var(--faint);align-self:center;padding-left:2px}

/* ---- Menu-less concept -------------------------------------------------------------
   No persistent menu of any kind. The top bar carries the product mark, a short trail
   and search; the four big buttons at the top of the page content are the whole
   navigation model; the bottom bar carries favourites, recents and what is open. ---- */
.mshell{min-height:100vh;display:flex;flex-direction:column}
.mshell[hidden]{display:none}
body.menuless .shell{display:none}
body.menuless .bottombar{display:none}
body.menuless{padding-bottom:0}
/* three tracks rather than a flex spacer: search is centred on the window, so a longer
   trail cannot push it off centre the way it can in the Tailored bar */
.mtop{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:10px;height:58px;padding:0 18px;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.mleft{display:flex;align-items:center;gap:10px;min-width:0}
.mtools{display:flex;align-items:center;gap:10px;justify-content:flex-end;min-width:0}
/* the wordmark is the way home, the way a product logo usually is. No fill at rest and
   none of the pill shapes around it — it should read as the product's name, not as one
   more control in the row — but it carries a real hit area and a quiet hover so it does
   not look inert. The negative margin cancels its own padding, so the name still starts
   on the bar's 18px edge. */
.mbrand{display:flex;align-items:center;flex:none;height:36px;padding:0 9px;margin-left:-9px;
  border-radius:9px;transition:background .14s}
.mbrand:hover,.mbrand:focus-visible{background:var(--surface-3)}
.mbrand .nm{font-family:Newsreader,serif;font-size:16.5px;color:var(--ink);white-space:nowrap}
/* the fifth avatar slot, and the only one in a top bar. Still a span rather than a
   button — the other two concepts show the profile without a menu behind it — but it
   takes the same fill and the same hover as the company pill and the bell beside it,
   Taif's call, 29 Sep: it sat on --surface-2 while they sat on --surface, which read as
   a different kind of thing rather than as the third item in one row. */
.mprofile{width:32px;height:32px;border-radius:999px;background:var(--surface);flex:none;
  display:grid;place-items:center;overflow:hidden;font-size:11.5px;font-weight:600;
  color:var(--ink-2)}
.mprofile:hover{background:var(--surface-3);color:var(--ink)}
.mprofile img{width:100%;height:100%;object-fit:cover;display:block}
/* One trail, two concepts: Menu-less builds it out of buttons, Traditional out of spans.
   The m- prefix went when Traditional started using it — these are top-bar breadcrumbs,
   not a Menu-less part. Not to be confused with .crumbs (the Tailored bar's, which sheds
   crumbs to fit) or .bc (the one drawn inside a page). */
.topcrumbs{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden}
.topcrumb{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:210px;flex:0 1 auto}
button.topcrumb:hover{color:var(--ink)}
.topcrumb.here{color:var(--ink)}
/* Traditional's are spans by Taif's decision, so they take no pointer and no hover */
.topcrumbs.flat .topcrumb{cursor:default}
.topsep{color:var(--faint);font-size:12px;flex:none;line-height:1}
.msearch{display:flex;justify-content:center;min-width:0}
.mmain{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:58px}

/* The four big buttons are the entire navigation model here, so they sit in the content
   column rather than in the chrome — and they take the card's recipe, a fill plus a
   hairline, because that is what they are: objects standing on the page floor. The bar
   buttons stay fill-only; this row is not a bar.
   Since v22 the row is inserted INSIDE #page, under the informational half, so it needs
   no column of its own: the page's own max-width and padding already hold it. The band's
   72px foot is too much air above it, so menuless alone pulls that in. */
body.menuless .info{margin-bottom:34px}
.msegwrap{width:100%;margin:0 0 34px}
.mseg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.msegbtn{display:flex;align-items:center;gap:12px;min-height:68px;padding:0 15px;
  border-radius:14px;background:var(--surface);border:1px solid var(--line-2);
  text-align:left;transition:background .14s,border-color .14s}
.msegbtn:hover{background:var(--surface-2);border-color:var(--muted)}
.msegico{flex:none;display:grid;place-items:center;color:var(--ink-2)}
.msegtx{min-width:0;display:flex;flex-direction:column;gap:2px}
.msegnm{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msegds{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Centred, and the second line gone — Taif's call, 29 Sep. With one line of text left
   there is nothing for a left edge to line up, and four left-aligned labels in four
   equal columns leave four different amounts of empty space to their right. */
.msegbtn{justify-content:center;text-align:center}
/* the same "you are here" pair the sidebar rows and the open tab use */
.msegbtn.cur,.msegbtn.cur:hover{background:var(--accent-soft);border-color:var(--accent)}
.msegbtn.cur .msegnm{color:var(--accent);font-weight:500}
.msegbtn.cur .msegico{color:var(--accent)}
.msegbtn.cur .msegds{color:var(--ink-2)}
/* The page row under the segments. Taif's call, 29 Sep: the big buttons switch the
   dashboard, these leave it — so they are a different shape on purpose, small pills in a
   wrapping row rather than four equal slabs, and every one carries a chevron. The chevron
   is the whole point of the row: it is the only thing on this screen that says "this
   takes you somewhere else" before you press it.
   Fill plus a hairline, because they stand on the page ground like the cards do. */
.mpages{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mpagebtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px 0 14px;
  border-radius:999px;background:var(--surface);border:1px solid var(--line-2);
  color:var(--ink-2);font-size:13px;white-space:nowrap;flex:none;
  transition:background .14s,border-color .14s}
.mpagebtn:hover{background:var(--surface-2);border-color:var(--muted);color:var(--ink)}
.mpagebtn svg{color:var(--faint)}
.mpagebtn:hover svg{color:var(--ink-2)}
@media (max-width:1040px){ .mseg{grid-template-columns:repeat(2,1fr)} }
@media (max-width:700px){ .mseg{grid-template-columns:1fr} }

/* ---- Traditional's resource side panel ---------------------------------------------
   The same manager the Ressurser page draws, in a rail down the right-hand side, so a
   star can be pressed without leaving the page you are on. Traditional only: Hybrid has
   the sidebar for this and Menu-less is built around not having a rail at all.
   Full viewport height and over everything, both bars included — Taif's call, 25 Sep.
   z-index 55 clears .tbottom (50) and .ttop (40) but stays under #tmenu (60) and #tsub
   (61), so a menu opened before it still draws on top rather than behind it.
   75% of the window, which leaves a strip of the page in view as context; under 860px
   that strip is worth less than the room it costs, so the panel takes the whole width.
   860px is the file's existing breakpoint — the one where both breadcrumb trails go. */
.respanel{position:fixed;top:0;bottom:0;right:0;z-index:55;width:75vw;
  display:flex;flex-direction:column;background:var(--ground);
  border-left:1px solid var(--line-2);box-shadow:-18px 0 44px -28px rgba(42,22,20,.4)}
@media (max-width:860px){ .respanel{width:100vw;border-left:0} }
.respanel[hidden]{display:none}
/* The way out sits at the start of the header, ahead of the title, and again at the
   bottom left — Taif's call, 25 Sep. Two of them because the panel covers both bars: at
   75vw the list runs the full height of the window, so by the time you have scrolled to
   the end of 75 rows the header is a long way back up. */
.rp-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.rp-head h2{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);flex:1;min-width:0}
.rp-close{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-2);flex:none}
.rp-close:hover{background:var(--surface-3);color:var(--ink)}
.rp-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px 0}
/* fill only, no edge: it is chrome, not a widget on the page. No icon and just "Lukk" —
   Taif's call: the × in the header already carries the glyph, and one word is enough on a
   row where nothing competes with it. Padding is even now that nothing leads the label. */
.rp-foot{flex:none;display:flex;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.rp-back{display:flex;align-items:center;height:34px;padding:0 16px;
  border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px;
  transition:background .14s,color .14s}
.rp-back:hover{background:var(--surface-3);color:var(--ink)}
/* The toolbar stays on one row while it fits and breaks only when it does not — Taif's
   call, 25 Sep. The earlier version stacked it unconditionally, which wasted a row on a
   wide panel; the version before that let the chip group shrink to nothing, so the chips
   wrapped into a narrow column with the tools beside them, reading as overlap. The floor
   below is what fixes both: the chips keep a real minimum, so the tools wrap to their own
   line instead of squeezing them, and min() keeps that floor from overflowing a panel
   narrower than the floor itself. */
.rp-body .rmgr-top{margin-bottom:9px;gap:8px;flex-wrap:nowrap}
.rp-body .segctl{overflow-x:auto;scrollbar-width:none;max-width:100%;flex:0 1 auto}
.rp-body .segctl::-webkit-scrollbar{display:none}
.rp-body .rmgr-bar{padding:9px 5px 10px;gap:9px}
.rp-body .rmgr-bar .qf{flex:1 1 auto;min-width:min(100%,330px)}
.rp-body .rmgr-tools{flex:none}
/* the field is a search box, not a spacer — it takes its own width and stops there */
.rp-body .rmgr-tools .rsearch{flex:none}
.rp-body .rfoot{padding:9px 6px 0}
/* the page it covers keeps its own width — the rail sits over it rather than squeezing
   it, so nothing reflows when it opens and a measured task time is not spent on relayout */

@media (max-width:860px){ .crumbs{display:none} .topcrumbs{display:none} }
@media (max-width:640px){
  .page{padding-left:16px;padding-right:16px;padding-top:18px}
  .topbar{padding-left:16px;padding-right:16px;gap:7px;flex-wrap:wrap}
  .coswitch{display:none}
  .searchwrap{order:3;flex-basis:100%;padding:2px 0 0}
  .board{grid-template-columns:1fr}
  .favbtn{padding:0 10px 0 13px} .favbtn .lbl{display:none}
  .bottombar{padding-left:14px;padding-right:14px}
  .favpop{left:14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>


<div class="shell">
  <header class="topbar" id="topbar">
    <div class="brand">
      <button class="iconbtn logo" id="btnHome" title="ERP Business Platform home" aria-label="ERP Business Platform home"><svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="ERP Business Platform"><!-- four-pointed star: four circular arcs (control arms at 0.5523r, the circle constant), so the concave sides are true quarter-circles and the points stay crisp at 24px --><path d="M12,0C12,6.63 17.37,12 24,12C17.37,12 12,17.37 12,24C12,17.37 6.63,12 0,12C6.63,12 12,6.63 12,0Z" fill="currentColor"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Brødsmuler" style="position:relative"></nav>
    </div>

    <div class="searchwrap" style="position:relative">
      <button class="searchbtn" id="btnSearch">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex:none"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg>
        <span class="ph">Søk, eller beskriv hva du vil gjøre …</span>
        <span class="kbd">⌘K</span>
        <span class="note tr" data-note="2">2</span>
      </button>
    </div>

    <div class="tools">
      <button class="coswitch">Alle selskaper <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5" /> <path d="m7 9 5-5 5 5" /></svg></button>
      <button class="iconbtn" id="btnApps" title="Apper" style="position:relative">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1" /> <circle cx="19" cy="5" r="1" /> <circle cx="5" cy="5" r="1" /> <circle cx="12" cy="12" r="1" /> <circle cx="19" cy="12" r="1" /> <circle cx="5" cy="12" r="1" /> <circle cx="12" cy="19" r="1" /> <circle cx="19" cy="19" r="1" /> <circle cx="5" cy="19" r="1" /></svg>
        <span class="note tr" data-note="3">3</span>
      </button>
      <button class="iconbtn" id="btnAI" title="Ask ERP AI" aria-label="Ask ERP AI">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" /> <path d="M20 2v4" /> <path d="M22 4h-4" /> <circle cx="4" cy="20" r="2" /></svg>
      </button>
      <button class="iconbtn" title="Notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0" /> <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" /></svg>
        <span class="badge tnum">12</span>
      </button>
      <button class="avatar" id="avatar" aria-label="Your profile"></button>
    </div>
  </header>

  <main class="page" id="page"></main>
</div>


<!-- Hybrid concept shell. Hidden unless the rig selects that concept; #page is moved
     into .hmain when it is, so every existing view renders inside it unchanged. -->
<div class="hshell" id="hshell" hidden>
  <aside class="hsb" id="hsb">
    <div class="hsb-grip" id="hsbGrip" role="separator" aria-orientation="vertical"
         aria-label="Endre bredden på menyen" tabindex="0"></div>
    <button class="hsb-top" id="hsbTop" aria-expanded="true" aria-label="Lukk menyen">
      <span id="hsbTopIcon" aria-hidden="true"></span>
      <span class="tl">ERP Business Platform</span>
    </button>
    <nav class="hsb-nav" aria-label="Main">
      <div class="hgh"><span class="hsb-lab">Meny</span>
        <button class="hgh-btn" id="hTopMenu" aria-haspopup="menu" aria-expanded="false"
                title="Velg synlige menypunkter" aria-label="Velg synlige menypunkter"></button></div>
      <div id="hsbTopItems"></div>
      <hr>
      <div class="hgh"><span class="hsb-lab">Moduler</span>
        <button class="hgh-btn" id="hModMenu" aria-haspopup="menu" aria-expanded="false"
                title="Tilpass moduler" aria-label="Tilpass moduler"></button></div>
      <div id="hsbModules"></div>
      <div id="hsbShortWrap">
        <hr>
        <div class="hgh"><span class="hsb-lab">Snarveier</span>
          <button class="hgh-btn" id="hShortMenu" aria-haspopup="menu" aria-expanded="false"
                  title="Valg for snarveier" aria-label="Valg for snarveier"></button></div>
        <div id="hsbShort"></div>
      </div>
    </nav>
    <div class="hsb-foot" id="hsbFoot"></div>
  </aside>
  <div class="hmain" id="hmain">
    <div class="htop">
      <div class="hsearch" id="hSearchSlot"></div>
      <span class="sp"></span>
      <button class="orgbtn" id="hOrg" aria-haspopup="menu" aria-expanded="false"></button>
      <button class="iconbtn" id="hBell" style="position:relative" aria-label="Varsler">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19a2 2 0 004 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="badge" id="hBellN">2</span></button>
    </div>
  </div>
</div>
<!-- Traditional concept shell. No side menu: the burger and the module dropdown carry
     all navigation. #page moves into .tmain when the concept is selected. -->
<div class="tshell" id="tshell" hidden>
  <div class="ttop">
    <button class="tburger" id="tBurger" aria-haspopup="menu" aria-expanded="false"
            title="Meny" aria-label="Meny"></button>
    <button class="tmodbtn" id="tModBtn" aria-haspopup="menu" aria-expanded="false" hidden></button>
    <span class="tvrule"></span>
    <nav class="topcrumbs flat" id="tcrumbs" aria-label="Brødsmuler"></nav>
    <span class="sp"></span>
    <button class="orgbtn" id="tOrg" aria-haspopup="menu" aria-expanded="false"></button>
    <button class="iconbtn" id="tBell" style="position:relative" aria-label="Varsler"></button>
  </div>
  <div class="tmain" id="tmain"></div>
</div>
<!-- Menu-less concept shell. No burger, no module menu, no sidebar: the big buttons at
     the top of #page are the navigation, and the bottom bar is the only pinned chrome. -->
<div class="mshell" id="mshell" hidden>
  <div class="mtop">
    <div class="mleft">
      <button class="mbrand" id="mBrand" title="Til oversikten"
              aria-label="ERP Business — til oversikten"><span class="nm">ERP Business</span></button>
      <span class="tvrule"></span>
      <nav class="topcrumbs" id="mcrumbs" aria-label="Brødsmuler"></nav>
    </div>
    <div class="msearch" id="mSearchSlot"></div>
    <div class="mtools">
      <button class="orgbtn" id="mOrg" aria-haspopup="menu" aria-expanded="false"></button>
      <button class="iconbtn" id="mBell" style="position:relative" aria-label="Varsler"></button>
      <span class="mprofile" id="mProfile"></span>
    </div>
  </div>
  <div class="mmain" id="mmain"></div>
</div>
<!-- One bottom bar, shared by Traditional and Menu-less. It sits outside every shell and
     is hidden explicitly, so "is it rendered" is a property of the node, not of an
     ancestor that happens to be display:none. -->
<aside class="respanel" id="tResPanel" hidden aria-label="Ressurser">
  <div class="rp-head">
    <button class="rp-close" id="tResPanelX" aria-label="Lukk ressurspanelet" title="Lukk"></button>
    <h2>Ressurser</h2></div>
  <div class="rp-body" id="tResPanelBody"></div>
  <div class="rp-foot">
    <button class="rp-back" id="tResPanelClose">Lukk</button></div>
</aside>
<nav class="tbottom" id="tbottom" aria-label="Ressurser og åpne sider" hidden>
  <button class="tresbtn" id="tResBtn" aria-haspopup="menu" aria-expanded="false"></button>
  <button class="toppbtn" id="tOppBtn" aria-haspopup="menu" aria-expanded="false"></button>
  <span class="tvrule"></span>
  <div class="ttabs" id="ttabs"></div>
</nav>
<div class="tmenu" id="tmenu" hidden role="menu"></div>
<div class="tsub" id="tsub" hidden role="menu"></div>

<div class="ovm" id="ovm" hidden role="menu"></div>

<div class="pop" id="appspop" hidden></div>
<div class="pop" id="boardpop" hidden role="menu"></div>
<div class="pop" id="profilepop" hidden role="menu"></div>

<nav class="bottombar" aria-label="Favoritter og åpne ressurser">
  <button class="favbtn" id="btnFav" style="position:relative" aria-haspopup="menu" aria-expanded="false">
    <span class="lbl">Favoritter</span><span class="n tnum" id="favN">5</span>
    <span class="favchev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5" /> <path d="m7 9 5-5 5 5" /></svg></span>
    <span class="note tl" data-note="12">12</span>
  </button>
  <button class="recentbtn" id="btnRecent" aria-haspopup="menu" aria-expanded="false"
          title="Sist brukt" aria-label="Sist brukt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></svg></button>
  <span class="vrule"></span>
  <div class="opens" id="opens"></div>
</nav>

<div class="favpop" id="favpop" hidden></div>
<div class="favpop recentpop" id="recentpop" hidden></div>

<div class="scrim" id="scrim" hidden>
  <div class="palette" role="dialog" aria-label="Søk" aria-modal="true">
    <div class="pfield">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex:none"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg>
      <input id="q" placeholder="Søk, eller beskriv hva du vil gjøre …" autocomplete="off" spellcheck="false">
      <span class="modehint" id="modehint">Keyword</span>
    </div>
    <div class="presults" id="presults"></div>
    <div class="pfoot">
      <span><b>↑↓</b> move</span><span><b>↵</b> open</span><span><b>esc</b> close</span>
      <span style="margin-left:auto">Filtrert etter tilgangene dine</span>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="confirm" id="confirm" hidden>
  <div class="cbox" role="alertdialog" aria-modal="true">
    <span class="ct-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="currentColor"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" /></svg></span>
    <h3 id="cTitle">Start wage run?</h3>
    <p id="cBody">Dette bokfører lønn for 48 ansatte.</p>
    <div class="cbtns"><button class="btn" id="cCancel">Avbryt</button><button class="btn primary" id="cGo">Confirm</button></div>
  </div>
</div>

<aside class="notespanel" id="notespanel" hidden aria-label="Design notes"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<button class="rig rigbtn" id="rigBtn" title="Prototype settings (Shift + P)">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
  <span id="rigState" class="st">Traditional · Design</span>
</button>
<div class="rig rigscrim" id="rigScrim" hidden>
  <div class="rigbox" role="dialog" aria-modal="true" aria-label="Prototype settings" id="rigBox"></div>
</div>

/* ============ masonry ============
   CSS multi-column fills a column at a time; these grids read row by row, so each
   block goes into whichever column is currently shortest, in source order. */
function layoutMasonry(box, colw, gap){
  if(!box || !box.clientWidth) return;
  var blocks = Array.prototype.slice.call(box.querySelectorAll('[data-mi]'));
  if(!blocks.length) return;
  blocks.sort(function(a,b){ return (+a.getAttribute('data-mi')) - (+b.getAttribute('data-mi')); });
  var n = Math.max(1, Math.floor((box.clientWidth + gap) / (colw + gap)));
  if(box.getAttribute('data-cols') == n && box.children.length) return;
  box.setAttribute('data-cols', n);
  box.innerHTML='';
  box.style.display='grid';
  box.style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';
  box.style.columnGap=gap+'px';
  var cols=[], h=[];
  for(var i=0;i<n;i++){
    var c=document.createElement('div'); c.className='mcol';
    box.appendChild(c); cols.push(c); h.push(0);
  }
  blocks.forEach(function(b){
    var k=0; for(var i=1;i<n;i++) if(h[i]<h[k]) k=i;
    cols[k].appendChild(b);
    h[k]+= b.offsetHeight + (parseFloat(getComputedStyle(b).marginBottom)||0);
  });
}
function relayoutGrids(){
  layoutMasonry(document.querySelector('.rgrid'), 236, 26);
  layoutMasonry(document.querySelector('.favgrid'), 224, 30);
}

/* ============ figures ============ */
/* 4px rounded data-end, square at the baseline — so a path, not a rect with rx */
function barPath(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return 'M'+x+','+(y+h)+'V'+(y+r)+'a'+r+','+r+' 0 0 1 '+r+',-'+r
       +'h'+(w-2*r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'V'+(y+h)+'Z';
}
function spark(vals,label){
  var W=132,H=40,n=vals.length,slot=W/n,bw=slot-3.4,r=2; /* 3.4 leaves the surface gap */
  var max=Math.max.apply(null,vals), p='';
  for(var i=0;i<n;i++){
    var h=Math.max(r+1,(vals[i]/max)*(H-2)), x=i*slot+(slot-bw)/2, y=H-h;
    p+='<path d="'+barPath(x,y,bw,h,r)+'" fill="'+(i===n-1?'var(--viz-accent)':'var(--viz-mute)')
      +'"><title>Week '+(i+1)+': '+vals[i]+'</title></path>';
  }
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'
    +esc(label)+', from '+Math.min.apply(null,vals)+' to '+max+', ending at '+vals[n-1]+'">'+p+'</svg>';
}

/* A greeting only earns its place if it says something. The name and the hour are the

   the collections below are built from. */
function greeting(){
  var h=new Date().getHours();
  return h<5?'Fortsatt oppe' : h<12?'God morgen' : h<18?'God ettermiddag' : 'God kveld';
}
/* the figures, the dates and the focus line all come from the profile when it has

var UP_SHOWN = 3;   /* dates shown before "View all" */
function pKPIS(){ return profile().kpis || KPIS; }

function focusLine(){
  if(profile().focus) return profile().focus;

       +'</b> før periode 8 låses, om 3 dager.';
}
/* One band, both concepts. Hybrid passes its own heading — the product name rather than
   a greeting — and turns the design-note markers off: those notes are written about the
   Tailored dashboard and would point at the wrong thing from inside Hybrid. */
function infoHTML(opts){
  opts=opts||{};
  var marks = opts.notes===false ? function(){return '';} : nb;
  var p=profile(), first=(p.person||'').split(' ')[0];
  var d=new Date(), days=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
  var months=['januar','februar','mars','april','mai','juni','juli','august','september',
              'oktober','november','desember'];
  var date=days[d.getDay()]+' '+d.getDate()+'. '+months[d.getMonth()];

  var eyebrow='<span class="info-eyebrow">'+esc(date)+' · Nordvik AS</span>';
  var head='<h1'+(opts.bigHeading?' class="big"':'')+'>'
   +(opts.heading ? esc(opts.heading)
                  : esc(greeting())+(first?', '+esc(first):''))+'</h1>';
  /* eyebrowUnder swaps the two; the CSS class moves the margin with them */
  var under = opts.eyebrowUnder===true;
  var say='<div class="info-say'+(under?' eyebrow-under':'')+'" style="position:relative">'
   +marks(1,'tr')
   +(under ? head+eyebrow : eyebrow+head)
   /* focus:false drops the line, it does not blank it — focusLine() is untouched and
      still counts the approvals and blockers for whoever asks for it. */
   +(opts.focus===false ? '' : '<p class="info-focus">'+focusLine()+'</p>')
   +'</div>';

  var figs='<div class="info-figs" style="position:relative">'+marks(19,'tl')
   +pKPIS().map(function(k){
      return '<div class="fig">'
       +'<div class="fig-val">'+esc(k.value)+'<span class="unit">'+esc(k.unit)+'</span></div>'

       +'<div class="fig-d '+k.tone+'">'+ARROW[k.dir]+esc(k.delta)+'</div></div>';
    }).join('')+'</div>';

  var next='<div class="info-next" style="position:relative">'+marks(18,'tr')
   /* three, not four: the fourth row made this column taller than the figures beside
      it and set the height of the whole band. "View all" is the way to the rest. */
   +pUP().slice(0,UP_SHOWN).map(function(u){
      return '<button class="nx-row'+(u.soon?' soon':'')+'" data-go="'+esc(u.go)+'" data-t="'+u.t+'">'

       +'<span class="nx-what">'+esc(u.what)+'</span>'
       +'<span class="nx-go">'+I.arrow+'</span></button>';}).join('')
   +'<button class="nx-all" id="nxAll">Vis alle '+I.chev+'</button></div>';

  return '<section class="info">'+say+figs+next+'</section>';
}

/* The manager's own body — module tabs, filter chips, view switch, search, rows, footer.
   Extracted so the Ressurser page and Traditional's side panel draw the same thing from
   one place; `panel` only drops the fullscreen button, which a rail has no use for.
   The two hosts never coexist, so the ids inside stay unique: opening the panel while the
   page is up is refused below, and navigating to the page closes the panel. */
function resMgrHTML(panel){
  /* categories are per module, so a chip selected under one module may not exist under
     the next — without this the page would filter on a category nothing can match and
     read as "no results" with no chip pressed */
  if(!resFilters().some(function(f){ return f[0]===resCat; })) resCat='Alle';
  var mods=profile().modules, counts={};
  mods.forEach(function(m){ counts[m]=RESOURCES.filter(function(r){return r.module===m;}).length; });
  return '<div class="rmgr-top">'
   + (mods.length>1
      ? '<div class="segctl" role="tablist">'
        + ['Alle'].concat(mods).map(function(m){
            return '<button class="seg" data-rmod="'+esc(m)+'" aria-pressed="'+(resModule===m)+'">'
             +esc(m)+(m==='Alle'?'':' <span style="opacity:.55">('+counts[m]+')</span>')+'</button>';}).join('')
        +'</div>'
      : '')
   +'<span class="sp"></span>'
   /* The panel drops all three page-level controls — Taif's call. New and the overflow
      menu only toast, and fullscreen means nothing in something already covering the
      window; in a panel opened to press one star they are three ways to be distracted
      from it. wireResMgr() guards for their absence. */
   + (panel ? ''
      : '<button class="boardbtn" id="rNew" title="Ny ressurs" aria-label="Ny ressurs">'+I.plus+'</button>'
        +'<button class="boardbtn" id="rExpand" title="'+(resExpanded?'Avslutt fullskjerm':'Fullskjerm')+'"'
        +' aria-label="'+(resExpanded?'Avslutt fullskjerm':'Fullskjerm')+'">'
        +(resExpanded?I.collapse:I.expand)+'</button>')
   +'</div>'

   +'<section class="rmgr">'
   +'<div class="rmgr-bar">'
   +  '<div class="qf">'
   +  resFilters().map(function(f){
        var n=filteredResources(f[0]).length;
        /* An empty chip was a dimmed row until every module had its own categories; now
           the four generic groups match nothing anywhere, and on Alle they were four
           chips reading 0 in front of the fifteen that mean something. A chip that can
           only ever show you nothing is dropped. Alle and Favoritter always stay —
           Favoritter at zero is a real state, and it is where Fjern alle lives. */
        if(!n && f[0]!=='Alle' && f[0]!=='Favoritter') return '';
        return '<button class="qfbtn'+(n?'':' empty')+'" data-rcat="'+esc(f[0])+'"'
         +' aria-pressed="'+(resCat===f[0])+'">'+esc(f[0])
         +' <span class="qfn">'+n+'</span></button>';
      }).join('')
   +  '</div>'
   +  '<div class="rmgr-tools">'
   +    '<div class="segctl">'
   +      '<button class="seg ico" data-rview="list" aria-pressed="'+(resView==='list')+'" title="Liste" aria-label="Listevisning">'+I.list+'</button>'
   +      '<button class="seg ico" data-rview="grid" aria-pressed="'+(resView==='grid')+'" title="Rutenett" aria-label="Rutenettvisning">'+I.grid+'</button>'
   +    '</div>'
   +    '<label class="rsearch"><input id="rq" type="search" placeholder="Søk" autocomplete="off" value="'+esc(resQuery)+'">'+I.search+'</label>'
   +    (panel ? ''
          : '<button class="boardbtn" id="rMore" aria-expanded="false" aria-haspopup="menu" title="Flere valg" aria-label="Flere valg">'+I.ell+'</button>')
   +  '</div>'
   +'</div>'
   +'<div class="rows rmgr-rows" id="rRows"></div>'
   /* The footer carries one aside about favourites; on the Favoritter chip it carries the
      action instead, so the row still holds two things and the strip under the list stays
      the place where favourites are talked about.
      Not in the toolbar above: that row already breaks onto two lines when the chips and
      the tools do not both fit, and a 120px button would have made it break at every
      width rather than only at narrow ones. */
   +'<div class="rfoot"><span id="rCount"></span>'
   + (resCat==='Favoritter' && favCount()
      ? '<button class="boardbtn lbl" id="rClearFav" title="Fjern alle favoritter"'
        +' aria-label="Fjern alle favoritter">'+I.starOff+'<span>Fjern alle favoritter</span></button>'
      : '<span>'+(settings.concept==='hybrid'
          ? 'Favoriserte ressurser blir snarveier i menyen'
          : 'Favorisering skjer her, ikke i samlingene')+'</span>')
   +'</div>'
   +'</section>';
}
/* The controls inside the manager, wired to whichever host drew them. `again` is the
   host's own re-render, so a chip press redraws the panel when it is the panel and the
   page when it is the page. */
function wireResMgr(root, again){
  root.querySelectorAll('[data-rmod]').forEach(function(b){
    b.addEventListener('click',function(){resModule=b.getAttribute('data-rmod');again();});});
  root.querySelectorAll('[data-rcat]').forEach(function(b){
    b.addEventListener('click',function(){resCat=b.getAttribute('data-rcat');again();});});
  root.querySelectorAll('[data-rview]').forEach(function(b){
    b.addEventListener('click',function(){resView=b.getAttribute('data-rview');again();});});
  /* absent in the panel, so both are looked up before they are wired */
  var nw=$('#rNew');
  if(nw) nw.addEventListener('click',function(){toast('Ny ressurs — ikke bygget i denne prototypen.');});
  var mr=$('#rMore');
  if(mr) mr.addEventListener('click',function(e){e.stopPropagation();toggleResMenu();});
  var cf=$('#rClearFav');
  if(cf) cf.addEventListener('click',function(e){
    e.stopPropagation();
    var n=favCount();
    askAction('Fjern alle favoritter?',
      'Dette fjerner ' + n + ' favoritt' + (n===1?'':'er')
        + ' fra denne profilen i dette konseptet. De andre konseptene beholder sine.',
      'Fjern alle',
      function(){ clearAllFavourites(); toast(n+' favoritt'+(n===1?'':'er')+' fjernet.'); again(); });});
  /* the field keeps focus because only the list repaints, not the host */
  var q=$('#rq');
  q.addEventListener('input',function(){resQuery=q.value;paintResRows();});
}

/* the header's height changes when the serif swaps in, which moves the card's top.
   Watch it rather than guessing when fonts have settled. */
var resRO=null;
function watchHead(){
  if(!window.ResizeObserver) return;
  if(resRO) resRO.disconnect();
  var head=document.querySelector('.rhead'); if(!head) return;
  resRO=new ResizeObserver(function(){ sizeManager(); });
  resRO.observe(head);
}

/* the card runs to the bottom of the viewport, clearing the bottom bar and 16px.
   In fullscreen the wrapper is fixed at inset 8px, so flex does the sizing instead. */
function sizeManager(pass){
  pass = (typeof pass==='number') ? pass : 0;   /* callers include RO, which passes an array */
  var wrap=document.getElementById('rWrap'); if(!wrap) return;
  /* size the wrapper, not the card: the card is a flex child, so flex:1 would
     beat an explicit height on it */
  if(resExpanded){ wrap.style.height=''; return; }
  /* two bottom bars exist in the file and at most one is ever rendered: the Tailored
     one and Traditional's. Hybrid shows neither, and then the card runs to the floor.
     Measure the box, not the computed display — a child of a hidden shell still reports
     its own display, but its rect is zero. */
  var barH=0;
  ['.tbottom','.bottombar'].forEach(function(sel){
    var b=document.querySelector(sel);
    if(b) barH=Math.max(barH, b.getBoundingClientRect().height);});
  var target=window.innerHeight - barH - 16;          /* where the card should end */
  var r=wrap.getBoundingClientRect();
  var delta=target - r.bottom;
  /* correct against the measured bottom instead of trusting a measured top —
     self-correcting, so a late font swap just nudges it back into place */
  if(Math.abs(delta)>0.5){
    wrap.style.height=Math.max(300, r.height+delta)+'px';
    /* one correction can land on a layout that then shifts again — settle over a few frames */
    if(pass<4) requestAnimationFrame(function(){ sizeManager(pass+1); });
  }
}
window.addEventListener('resize',sizeManager);
/* the serif loads after first paint and moves the header, so measure again once it lands */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(sizeManager);

/* `cat` defaults to the chip that is pressed; passing one asks what ANOTHER chip would
   give, which is how each chip gets its own count. Everything else — the profile's
   modules, the module tab and the search box — still applies, so a count is a promise of
   what clicking it produces rather than a number about the whole library. */
function filteredResources(cat){
  cat = cat || resCat;
  var mods=profile().modules, nq=resQuery.trim().toLowerCase();
  return RESOURCES.filter(function(r){
    if(mods.indexOf(r.module)<0) return false;
    if(resModule!=='Alle' && r.module!==resModule) return false;
    if(cat==='Favoritter'){ if(!resFav[resKey(r)]) return false; }
    else if(cat!=='Alle'){
      var f=resFilters().find(function(x){return x[0]===cat;});
      if(f && f[1] && f[1].indexOf(r.cat)<0) return false;
    }
    if(nq && r.n.toLowerCase().indexOf(nq)<0 && r.module.toLowerCase().indexOf(nq)<0) return false;
    return true;
  });
}
function resKey(r){ return r.module+'::'+r.n; }

              'Betalingsformidling':'action', 'Kundereskonto':'register',

/* Grid view shows a category whole unless it is long: at or under the threshold every
   item is there and no button appears, and only past it does the column collapse to
   GRID_SHOWN with "Vis alle N" underneath. Two numbers rather than one, Taif's call — a
   single cap meant a category of 9 was truncated to 8 and asked you to click for the one
   you could not see. The gap between them is deliberate: collapsing to 10 only ever hides
   at least three, so the button is always worth its own row. */
var GRID_THRESHOLD=12;    /* show everything at or below this */
var GRID_SHOWN=10;        /* how many a longer category shows before "Vis alle" */
var resShowAll={};        /* per-category expansion in grid view */

/* The chips are rendered once with the page, but their counts answer a question that
   changes as you type in the search box or press a star — and re-rendering the page on a
   keystroke would take the caret out of the input. So the numbers are repainted in place
   from paintResRows(), which every one of those paths already calls. */
function paintQfCounts(){
  document.querySelectorAll('.qf .qfbtn').forEach(function(b){
    var n=filteredResources(b.getAttribute('data-rcat')).length,
        el=b.querySelector('.qfn');
    if(el) el.textContent=n;
    b.classList.toggle('empty', !n);
  });
}
function paintResRows(){
  if(resView==='grid') paintResGrid(); else paintResList();
  paintQfCounts();
}

function paintResList(){
  var list=filteredResources(), ul=$('#rRows');
  /* one block per category, in a fixed order — empty categories drop out entirely */
  var html='';
  /* while a search is running every group is forced open: a collapsed one would hide
     matches behind a header that still shows a count, which reads as "no results" */
  var forceOpen=!!resQuery.trim();
  RES_CATS.forEach(function(cat){
    var rows=list.filter(function(r){return r.cat===cat;});
    if(!rows.length) return;

  var scoped = resModule!=='Alle';
  return {
    id:catId(cat),

    mark:'m'+cat,

/* Which container you were in when you opened something. Traditional's trail is the path
   you actually walked, so a leaf carries the page it was opened from rather than deriving
   a parent from the resource's own data. A leaf opened from another leaf inherits that
   leaf's container: opening a second resource from the bottom bar does not move you. */
function tradContainer(){
  if(view.name==='hmod')      return {label:view.mod, mod:view.mod};
  if(view.name==='resources') return {label:'Ressurser'};
  if(view.name==='home')      return null;
  return view.path || null;
}
/* The fourth argument is Traditional's pin. Taif's call, 25 Sep: in that concept opening
   something no longer puts it on the bar — the bar holds what the person chose to keep,
   and nothing else. Everywhere else opening still pins, which is what those concepts were
   built around, so the flag is read only when the concept is Traditional.
   Recents are recorded either way: opening is still opening, whether or not it is kept. */
function openAsset(name,t,origin,pin){
  t=t||'asset';
  var path=tradContainer();
  var trad=settings.concept==='traditional';
  /* the route in is kept on the open entry, not only on view.from, so clicking back to a
     tab restores the trail it had rather than falling back to the generic one. Opening
     the same thing again by a different route updates it. */
  var ex=OPEN.filter(function(o){return o.n===name;})[0];
  if(ex){ ex.o=origin||null; ex.p=path; }
  else if(!trad || pin){
    OPEN.push({n:name,t:t,o:origin||null,p:path}); if(OPEN.length>6)OPEN.shift(); }
  noteRecent(name,t);
  view={name:'asset', item:{n:name,t:t}, from:origin||null, path:path};
  renderView(); window.scrollTo(0,0);
  renderOpens(name);
  /* a toast only where it says something. In Traditional an ordinary open leaves no
     trace on the bar, so there is nothing to announce. */
  if(!trad) toast('“'+name+'” åpnet — ligger i bunnlinjen til du lukker den.');
  else if(pin) toast(ex ? '“'+name+'” ligger allerede i bunnlinjen.'
                        : '“'+name+'” festet i bunnlinjen.');
}
/* The resource screens themselves are out of scope for this test — what is being
   measured is the route in, so every one of them lands on the same placeholder. */
function renderAsset(){
  var it=view.item, lbl=(TYPE[it.t]&&TYPE[it.t].label)||'Ressurs';
  $('#page').innerHTML='<div class="stub"><span class="tag">'+esc(lbl)+' · ikke bygget</span>'
   +'<h1>'+esc(it.n)+'</h1>'
   +'<p>Skjermbildet bak denne er utenfor omfanget — prototypen handler om å finne det, ikke om å fylle det ut.</p>'
   +'<p style="margin-top:14px">Sporet i topplinjen er veien tilbake. Kom du hit via en samling, '
   +'klikk den brødsmulen for å hoppe rett til noe annet i den.</p></div>';
  syncBar();
}
function renderOpens(cur){
  var el=$('#opens');
  /* the seeded open tabs are Accounting work; a payroll admin has not opened them and
     could not open them, so the bar scopes itself the way favourites and recents do */
  var vis=OPEN.filter(function(o){ return favScoped(o.n); });
  if(!vis.length){el.innerHTML='<span class="noopen">Ingenting åpent.</span>';return;}
  el.innerHTML=vis.map(function(o){
    return '<button class="opentab'+(o.n===cur?' cur':'')+'" data-n="'+esc(o.n)+'">'
     +'<span style="color:var(--faint);display:grid;place-items:center">'+I[o.t]+'</span>'
     +'<span class="lbl">'+esc(o.n)+'</span><span class="x" role="button" aria-label="Close">'+I.x+'</span></button>';}).join('');
  el.querySelectorAll('.opentab').forEach(function(b){
    b.addEventListener('click',function(e){
      var n=b.getAttribute('data-n');
      if(e.target.closest('.x')){OPEN=OPEN.filter(function(o){return o.n!==n;});renderOpens();
        toast('“'+n+'” lukket. Ligger fortsatt i favoritter hvis du har stjernemerket den.');}
      else{ var o=OPEN.filter(function(x){return x.n===n;})[0];
        view={name:'asset', item:{n:n, t:o?o.t:'asset'}, from:null};
        renderView(); window.scrollTo(0,0); renderOpens(n); }});});
}
/* the badge counts what the panel would actually show, not what is stored — otherwise
   a scoped-out favourite is invisible but still adds to the number */
function favVisibleCats(){

/* What the bar's number means: every resource you could reach from the favourites list,
   not every entry in it. A favourited category contributes its resources rather than
   counting as one thing — Taif's call, 1 Oct. A resource that is both individually
   favourited and inside a favourited category counts twice, because the list shows it
   twice; the number and the list agree, which matters more than the arithmetic. */
/* Everything the favourites list holds, in one go: the three stores a loose favourite can
   live in, the favourited categories and their open state, and the keys filed into
   Hybrid's shortcut folders. The folders themselves stay — they are containers the person
   made, not favourites — and the computed Nylig brukt is left alone because it is not a
   favourites list at all, it is what they have opened. */
function clearAllFavourites(){

/* every loose favourite, whatever it was favourited from */
/* Module scope is not only about what the board shows. A favourite is a saved route,
   so a route into a module this profile cannot open must not be offered either — a
   payroll admin seeing "Trial balance" in their favourites would be a scope leak, and
   in a test it would read as a bug in the concept rather than in the data. */
function favScoped(n){
  var mods=profile().modules;
  var r=RESOURCES.find(function(x){return x.n===n;});
  if(r) return mods.indexOf(r.module)>-1;
  /* A module's own pages — HYB_SUBS — are openable things like any other, but they are
     in neither RESOURCES nor COLLECTIONS, so they fell through both tests and came back
     false: a page you had just opened never appeared among your open pages. Reachable in
     Hybrid since the module pages were built, and in Menu-less since the page row of
     29 Sep, so it is worth scoping properly rather than dropping. */
  var sub=null;
  Object.keys(HYB_SUBS).forEach(function(m){
    if(HYB_SUBS[m].indexOf(n)>-1) sub=m; });
  Object.keys(TRAD_PAGES).forEach(function(m){
    if(TRAD_PAGES[m].indexOf(n)>-1) sub=m; });
  if(sub) return mods.indexOf(sub)>-1;
  return COLLECTIONS.some(function(c){
    if(c.domain!=='Alle' && mods.indexOf(c.domain)<0) return false;
    return (c.items||[]).some(function(it){return it.n===n;});});
}
function looseFavs(){
  var out=[];
  /* a favourited page is an entry like any other — a collection page keys itself
     'detail:<id>' so it never collides with a resource of the same name */
  Object.keys(pageFav).forEach(function(k){
    if(k==='resources'){ out.push({t:'place', n:'Ressurser', s:'Hele biblioteket',
                                   key:'resources', src:'page'}); return; }
    /* collections are not part of this prototype; a 'detail:' key can only come
       from storage written by the other build, and would render as "Samling" */
    if(k.indexOf('detail:')===0){ return; }
    if(false){
      var c=COLLECTIONS.find(function(x){return x.id===k.slice(7);});
      if(c && c.domain!=='Alle' && profile().modules.indexOf(c.domain)<0) return;
      out.push({t:'place', n:c?c.title:k.slice(7), s:'Samling', key:k, src:'page'});
    }
  });
  Object.keys(favSet).forEach(function(n){
    if(!favScoped(n)) return;
    var rec=INDEX.find(function(x){return x.n===n;})||FAVS.find(function(x){return x.n===n;});
    out.push({t:rec?rec.t:'asset', n:n, s:rec&&rec.s?rec.s:'', key:n, src:'col'});});
  var mods=profile().modules;
  Object.keys(resFav).forEach(function(k){
    var r=RESOURCES.find(function(x){return resKey(x)===k;});
    /* a favourite from a module this profile cannot see is not theirs to open */
    if(r && mods.indexOf(r.module)<0) return;
    out.push({t:r?RES_TO_TYPE[r.cat]:'asset', n:r?r.n:k.split('::')[1],
              s:r?r.module+' · '+r.used.toLowerCase():'', key:k, src:'res'});});
  return out;
}

/* The panel resizes instantly; only the list cross-fades. Animating the box was
   the source of the jank — the content has to be re-laid out mid-flight either way. */
function switchFavMode(mode){
  var pop=$('#favpop'), body=pop.querySelector('.favbody');
  /* A swap is already in flight. Pressing the option it is heading for does nothing;
     pressing the one we are standing on cancels it and fades the list back in, rather
     than letting the timer land on a view nobody asked for. Without this, two fast
     clicks ended on the wrong view: the second call saw mode===favMode — favMode does
     not change until the timer fires — and returned without touching the timer. */
  if(favPendMode!==null){
    if(mode===favPendMode) return;
    clearTimeout(favSwapT); favPendMode=null;
    if(body) body.classList.remove('out');
    favPressed(favMode);
    return;
  }
  if(mode===favMode) return;
  clearTimeout(favSwapT);
  if(!body || prefersReduced()){ favMode=mode; renderFavPop(); return; }

  /* the control answers on the press, not 130ms later when the header is rewritten */
  favPressed(mode);
  body.classList.add('out');
  favPendMode=mode;
  favSwapT=setTimeout(function(){
    favPendMode=null;
    favMode=mode;
    renderFavPop(true);                                       /* resizes and renders, invisible */
    layoutMasonry(pop.querySelector('.favgrid'), 224, 30);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      var nb=pop.querySelector('.favbody'); if(nb) nb.classList.remove('pre');
    });});
  }, 130);
}
/* aria-pressed is both the accessible state and the styling hook, so moving it is all
   there is to moving the selection */

  $('#favpop').querySelectorAll('[data-fmode]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.getAttribute('data-fmode')===mode)); });

/* ---- The favourites panel on Menu-less's bar ---------------------------------------
   Taif's call, 30 Sep. That bar's Favoritter pill used to open the same flat #tmenu
   dropdown Traditional uses; it opens this panel instead, so the concept gets the view
   control — Kompakt and Full — and the group-by-type toggle with it.
   The panel itself is the one built for the Tailored shell and is reused unchanged: the
   sticky header, the cross-fade on switching, the masonry in Full. Only the anchoring is
   new, because it was written against a button that sits in a different bar. */
function placeFavPop(){
  var pop=$('#favpop'), btn=$('#tResBtn'); if(!btn) return;
  var r=btn.getBoundingClientRect();
  pop.style.left=Math.max(8, r.left)+'px';
  pop.style.bottom=(window.innerHeight - r.top + 8)+'px';
}
function closeMlFavPop(){
  clearTimeout(favSwapT); favPendMode=null;   /* nothing half-swapped is left behind */
  var pop=$('#favpop'); if(pop) pop.hidden=true;
  var btn=$('#tResBtn'); if(btn) btn.setAttribute('aria-expanded','false');
  var bf=$('#btnFav'); if(bf) bf.setAttribute('aria-expanded','false');
}
function toggleMlFavPop(){
  var pop=$('#favpop');
  if(!pop.hidden){ closeMlFavPop(); return; }
  closeTradMenus();

  placeFavPop();
  pop.hidden=false;
  $('#tResBtn').setAttribute('aria-expanded','true');
}

/* ============ recently used ============ */
/* Two sources feed one list: the seeded "Opened N ago" on every resource, and whatever
   has actually been opened in this session, which always outranks the seed. That way the
   menu is populated on the first screen of a test and still reacts to what the participant
   does — a recents list that never changes teaches the wrong thing. */
var RECENT_CAP=10;
function relTime(m){
  if(m==null) return '';
  if(m<1) return 'Nå nettopp';
  if(m<60) return Math.round(m)+' min siden';
  if(m<1440) return Math.round(m/60)+' t siden';
  if(m<2880) return 'I går';
  if(m<10080) return Math.round(m/1440)+' dager siden';
  if(m<43200) return Math.round(m/10080)+' uker siden';
  return 'Forrige måned';
}
var recentSeq=[];          /* names opened in this session, newest first */
function noteRecent(name,t){
  recentSeq=recentSeq.filter(function(r){return r.n!==name;});
  recentSeq.unshift({n:name, t:t});
  if(recentSeq.length>24) recentSeq.pop();
}
function recentList(){
  var mods=profile().modules, out=[], seen={};
  recentSeq.forEach(function(r){
    if(out.length>=RECENT_CAP || seen[r.n]) return;
    var res=RESOURCES.find(function(x){return x.n===r.n;});
    if(res && mods.indexOf(res.module)<0) return;   /* not in this profile's modules */
    seen[r.n]=1;
    out.push({t:(res?RES_TO_TYPE[res.cat]:r.t)||'asset', n:r.n,
              key:res?resKey(res):r.n, src:res?'res':'col', when:'Nå nettopp'});
  });
  /* the seeded "opened N ago" is somebody's history — a first-time user has none, so the
     list is only what they have opened in this session */
  if(profile().fresh) return out;
  RESOURCES.filter(function(r){
    return mods.indexOf(r.module)>-1 && r.mins!=null && !seen[r.n];
  }).sort(function(a,b){ return a.mins-b.mins; }).forEach(function(r){
    if(out.length>=RECENT_CAP) return;
    seen[r.n]=1;
    out.push({t:RES_TO_TYPE[r.cat], n:r.n, key:resKey(r), src:'res', when:relTime(r.mins)});
  });
  return out;
}
function renderRecentPop(){
  var pop=$('#recentpop'), list=recentList();
  var head='<div class="favhead"><h3>Sist brukt</h3></div>';
  var html = list.length
    ? '<div class="favlist">'+list.map(function(it){
        return '<div class="frow" data-rn="'+esc(it.n)+'" data-rt="'+it.t+'" data-rs="'+it.src+'">'
         +'<span class="ft">'+I[it.t]+'</span>'
         +'<span class="fx"><span class="fn">'+esc(it.n)+'</span></span>'
         +'<span class="fwhen">'+esc(it.when)+'</span></div>';}).join('')+'</div>'
    : '<p class="favempty">Nothing opened yet. Anything you open shows up here.</p>';
  pop.innerHTML=head+'<div class="favbody">'+html+'</div>';
  pop.querySelectorAll('.frow').forEach(function(row){
    row.addEventListener('click',function(e){
      e.stopPropagation(); closeRecentPop();
      /* only a real resource can claim Resources as its parent — a collection item
         opened earlier in the session has no home to name, so it gets none */
      openAsset(row.getAttribute('data-rn'), row.getAttribute('data-rt'),
                row.getAttribute('data-rs')==='res' ? {type:'resources'} : null);});});
  /* the panel hangs off its own button rather than the left edge the favourites panel uses */
  pop.hidden=false;
  var r=$('#btnRecent').getBoundingClientRect(), w=pop.offsetWidth;
  pop.style.left=Math.max(8,Math.min(r.left, window.innerWidth-w-8))+'px';
}

$('#btnRecent').addEventListener('click',function(e){

  this.setAttribute('aria-expanded','true');
