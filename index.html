/* ============ breadcrumbs ============ */
/* Without a side menu the trail is the only thing on screen that says what sits above
   you. It is deliberately small: it reports position, it is not the primary way in. */
function buildTrail(){
  if(settings.concept!=='tailored') return [{label:concept().name}];
  /* Dashboard and Resources are siblings, not parent and child. Whichever one you came
     in through is the root of the trail, and it is never both — "Dashboard / Resources"
     would claim a hierarchy that does not exist. */
  if(view.name==='resources') return [{label:'Ressurser'}];
  if(view.name==='detail'){
    var c=COLLECTIONS.find(function(x){return x.id===view.cid;});
    return [{label:'Oversikt', go:'home'}, {label:c?c.title:'Samling'}];
  }
  if(view.name==='asset'){
    var f=view.from, t;
    if(f && f.type==='resources'){
      t=[{label:'Ressurser', go:'resources'}];
    } else if(f && f.type==='collection'){
      var cc=COLLECTIONS.find(function(x){return x.id===f.id;});
      /* the collection you came through stays in the trail, and it opens rather than
         navigates — its siblings are the likely next stop, not the collection page */
      t=[{label:'Oversikt', go:'home'}];
      if(cc) t.push({label:cc.title, go:'detail', cid:cc.id, menu:cc.id});
    } else {
      t=[{label:'Oversikt', go:'home'}];
    }
    t.push({label:view.item.n});
    return t;
  }
  return [{label:'Oversikt'}];
}
/* One star, three different stores underneath: a page favourite for Resources and for
   a collection, and the resource's own favourite when the trail ends on a resource —
   so the crumb star and the row star are always the same switch. */
function pageFavRef(){
  if(settings.concept!=='tailored') return null;
  if(view.name==='resources') return {k:'resources', store:pageFav, label:'Ressurser'};
  if(view.name==='detail'){
    var c=COLLECTIONS.find(function(x){return x.id===view.cid;});
    return {k:'detail:'+view.cid, store:pageFav, label:c?c.title:'this collection'};
  }
  if(view.name==='asset'){
    var n=view.item.n, r=RESOURCES.find(function(x){return x.n===n;});
    if(r) return {k:resKey(r), store:resFav, label:n};
    return {k:n, store:favSet, label:n};
  }
  return null;   /* the dashboard is already home — nothing to favourite */
}
function togglePageFav(){
  var ref=pageFavRef(); if(!ref) return;
  if(ref.store[ref.k]){ delete ref.store[ref.k]; toast('“'+ref.label+'” fjernet fra favoritter'); }
  else { ref.store[ref.k]=1; toast('“'+ref.label+'” lagt til i favoritter — alltid tilgjengelig fra bunnlinjen'); }
  syncFav(); renderView();
}
/* The trail lives in a box of fixed share, so it can never push the search field off
   centre. When it does not fit it sheds whole crumbs rather than ellipsing every one of
   them: the middle goes first (into a "…" that still opens them), then the first. The
   current page is never dropped — it is doing the job of a page heading. */
var _trail=[], _crumbHidden=[];
function renderCrumbs(){
  var el=$('#crumbs'); if(!el) return;
  _trail=buildTrail();
  paintCrumbs(0);
  centreSearch();
  fitCrumbs();
}
/* Fitting is not just "does the box overflow": the current page can ellipse its own
   text, which would silently hide the fact that a crumb should have been dropped
   instead. Dropping the middle comes first, so an ellipsed page name counts as a
   failure to fit. */
function crumbsFit(el){
  if(el.scrollWidth > el.clientWidth+1) return false;
  var t=el.querySelector('.crumb.here .t');
  if(t && t.scrollWidth > t.clientWidth+1) return false;
  return true;
}
function fitCrumbs(){
  var el=$('#crumbs');
  if(!el || !el.clientWidth || getComputedStyle(el).display==='none') return;
  for(var lvl=0; lvl<=3; lvl++){
    if(el.getAttribute('data-lvl')!==String(lvl)) paintCrumbs(lvl);
    if(crumbsFit(el)) return;
  }
}
function paintCrumbs(lvl){
  var el=$('#crumbs'), t=_trail, n=t.length;
  el.setAttribute('data-lvl', lvl);
  _crumbHidden=[];
  /* 0: everything.  1: the middle collapses into "…".  2: the first joins it there.
     3: the page alone. Level 3 is a last resort — keeping the "…" costs about 28px and
     is the only way back once the trail is gone, which matters more in a concept with
     no side menu than the 28px does. */
  var show=[], k, j;
  if(lvl===0 || n<2){ show=t.map(function(c,i){return {i:i,c:c};}); }
  else if(lvl===1 && n>=3){
    show.push({i:0, c:t[0]});
    for(k=1;k<n-1;k++) _crumbHidden.push({i:k, c:t[k]});
    show.push({ell:1});
    show.push({i:n-1, c:t[n-1]});
  } else if(lvl<=2){
    for(j=0;j<n-1;j++) _crumbHidden.push({i:j, c:t[j]});
    show.push({ell:1});
    show.push({i:n-1, c:t[n-1]});
  } else {
    for(j=0;j<n-1;j++) _crumbHidden.push({i:j, c:t[j]});
    show.push({i:n-1, c:t[n-1]});
  }

  el.innerHTML=show.map(function(s,pos){
    var sep = pos ? '<span class="crumbsep" aria-hidden="true">/</span>' : '';
    if(s.ell) return sep+'<button class="crumb link ell" id="crumbEll" aria-haspopup="menu"'
      +' title="Vis stegene imellom" aria-label="Vis stegene imellom">…</button>';
    if(s.i===t.length-1){
      var ref=pageFavRef(), on=!!(ref&&ref.store[ref.k]);
      var lb=(on?'Remove ':'Favourite ')+s.c.label;
      return sep+'<span class="crumb here" aria-current="page" title="'+esc(s.c.label)+'">'
        +'<span class="t">'+esc(s.c.label)+'</span></span>'
        +(ref?'<button class="crumbfav'+(on?' on':'')+'" id="crumbFav" aria-pressed="'+on+'"'
          +' title="'+esc(lb)+'" aria-label="'+esc(lb)+'">'+I.starL+'</button>':'');
    }
    return sep+'<button class="crumb link" data-ci="'+s.i+'" title="'+esc(s.c.label)+'"'
      +(s.c.menu?' aria-haspopup="menu" aria-expanded="false"':'')+'>'+esc(s.c.label)
      +(s.c.menu?'<span class="crumbcaret">'+I.chev+'</span>':'')+'</button>';
  }).join('') + nb(1,'tr');

  var cf=el.querySelector('#crumbFav');
  if(cf) cf.addEventListener('click',function(e){e.stopPropagation(); togglePageFav();});
  var ce=el.querySelector('#crumbEll');
  if(ce) ce.addEventListener('click',function(e){e.stopPropagation(); toggleCrumbEll(ce);});
  el.querySelectorAll('[data-ci]').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation(); goCrumb(_trail[+b.getAttribute('data-ci')], b);});
  });
  paintNotes();
}
function goCrumb(c, btn){
  if(!c) return;
  if(c.menu && btn){ toggleCrumbMenu(c.menu, btn); return; }
  closeBoardMenu();
  if(c.go==='home') view={name:'home'};

  else if(c.go==='detail') view={name:'detail', cid:c.cid};
  else return;
  renderView(); window.scrollTo(0,0);
}
/* the dropped crumbs are still reachable — truncation should cost width, not routes */
function toggleCrumbEll(btn){
  var pop=$('#boardpop');
  /* when the one thing hidden is the collection you came through, the "…" is that
     crumb collapsed — so it opens what the crumb would have opened, its contents */
  if(_crumbHidden.length===1 && _crumbHidden[0].c.menu){
    toggleCrumbMenu(_crumbHidden[0].c.menu, btn); return; }
  if(!pop.hidden && pop.getAttribute('data-for')==='ell'){ closeBoardMenu(); return; }
  pop.setAttribute('data-for','ell');

   + _crumbHidden.map(function(h,i){

       +'<span>'+esc(h.c.label)+'</span></button>';}).join('');

    b.addEventListener('click',function(){
      var h=_crumbHidden[+b.getAttribute('data-ei')];
      closeBoardMenu(); goCrumb(h.c, null);});});
}

  centreSearch(); fitCrumbs(); }); }catch(e){}
/* the collection crumb opens the collection's contents in place — this is the whole
   point of keeping it in the trail: sideways moves without a trip back to the dashboard */
function toggleCrumbMenu(cid, btn){
  var pop=$('#boardpop');
  if(!pop.hidden && pop.getAttribute('data-for')==='crumb:'+cid){ closeBoardMenu(); return; }
  var c=COLLECTIONS.find(function(x){return x.id===cid;});

/* Centring the search cannot be done in CSS alone: the right-hand group has a fixed
   width, so the only way both sides come out equal is to give the field exactly the
   space left over after two of them. Brand is flex:1 1 0 and tools is flex:none, so
   once the field is this wide the brand's share equals the tools' width by arithmetic
   — and the trail can then be any length without moving the field. */
function centreSearch(){
  var bar=$('#topbar'), tools=bar&&bar.querySelector('.tools'), wrap=bar&&bar.querySelector('.searchwrap');
  if(!bar||!tools||!wrap) return;
  var cs=getComputedStyle(bar);
  if(cs.flexWrap==='wrap'){ wrap.style.width='';
    var cr=$('#crumbs'); if(cr) cr.style.width='';
    return; }   /* narrow: the bar is two rows and nothing is centred */
  var gap=parseFloat(cs.columnGap||cs.gap)||10;
  var inner=bar.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  /* no upper cap here: the wrapper takes the whole middle and the field centres inside
     it, capped at 560 by .searchbtn. Capping the wrapper instead would hand the surplus
     to the brand on wide screens and push the field right of centre. */
  var avail=inner-2*tools.offsetWidth-2*gap;

function hybResize(startX){
  var sb=$('#hsb'), grip=$('#hsbGrip');
  var startW=sb.getBoundingClientRect().width;
  sb.classList.add('resizing'); grip.classList.add('active');
  function move(x){
    var next=startW+(x-startX);
    /* dragging past the midpoint snaps to the icon rail rather than leaving a
       cramped in-between width — their behaviour, kept */
    if(next <= (HSB_MIN+HSB_RAIL)/2){ if(!hybState.collapsed) hybSetCollapsed(true); return; }
    if(hybState.collapsed) hybSetCollapsed(false);
    next=Math.max(HSB_MIN,Math.min(HSB_MAX,next));
    sb.style.width=next+'px'; hybState.width=next;
  }
  function mm(e){ move(e.clientX); }
  function tm(e){ if(e.touches[0]) move(e.touches[0].clientX); }
  function stop(){ sb.classList.remove('resizing'); grip.classList.remove('active');
    document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',stop);
    document.removeEventListener('touchmove',tm); document.removeEventListener('touchend',stop); }
  document.addEventListener('mousemove',mm); document.addEventListener('mouseup',stop);

      out+='</div>';
    }
    out+='</div>';
  });
  favs.forEach(function(f){
    if(!hybFolderOf(favKeyOf(f))) out+=hybFavRowHTML(f); });
  return out || '<div class="hsb-empty">Ingen snarveier ennå.</div>';
}

/* ---- inline create, the way a new project is made in a sidebar ---- */
function hybAddFolder(){
  var wrap=$('#hsbShort');
  var row=document.createElement('div');
  row.className='hfold-new';
  row.innerHTML='<span class="tico">'+HI.folderFill+'</span><input type="text" placeholder="Mappenavn">';
  wrap.insertBefore(row, wrap.firstChild);
  var inp=row.querySelector('input'); inp.focus();
  var done=false;
  function finish(save){
    if(done) return; done=true;
    var v=inp.value.trim();
    if(save && v) hybFolders.unshift({id:'f'+(++hybFoldSeq), name:v,
      color:HFOLD_COLORS[hybFoldSeq % HFOLD_COLORS.length], open:true, keys:[]});
    renderHybSidebar();
  }
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter') finish(true);
    if(e.key==='Escape') finish(false);});
  inp.addEventListener('blur',function(){ setTimeout(function(){ finish(true); },0); });
}
function hybRenameFolder(id){
  var fd=hybFolders.filter(function(f){return f.id===id;})[0]; if(!fd) return;
  var row=$('#hsbShort').querySelector('[data-hfoldid="'+id+'"] .hfold-row');
  if(!row) return;
  row.innerHTML='<span class="tico">'+HI.folderFill+'</span><input type="text" class="hfold-rename">';
  var inp=row.querySelector('input'); inp.value=fd.name; inp.focus(); inp.select();
  var done=false;
  function finish(save){
    if(done) return; done=true;
    var v=inp.value.trim(); if(save && v) fd.name=v;
    renderHybSidebar();
  }
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter') finish(true); if(e.key==='Escape') finish(false);});
  inp.addEventListener('blur',function(){ setTimeout(function(){ finish(true); },0); });
}
function hybColourMenu(btn,id){
  var fd=hybFolders.filter(function(f){return f.id===id;})[0]; if(!fd) return;
  hybMenu(btn, '<div class="ovm-lab">Mappefarge</div><div class="hcol-grid">'
   + HFOLD_COLORS.map(function(c){
      return '<button class="hcol'+(fd.color===c?' on':'')+'" data-hc="'+c+'"'
       +' style="background:'+c+'" aria-label="Velg farge"></button>';}).join('')
   +'</div><div class="ovm-g">'
   +'<button class="ovm-row" data-hfa="rename">Gi nytt navn</button>'
   /* the recents folder has no Slett: there is no control anywhere that would bring it
      back, so deleting it would be a one-way door in the middle of a session */
   +(fd.auto ? '' : '<button class="ovm-row destructive" data-hfa="delete">Slett mappe</button>')
   +'</div>',
   function(m){
    m.querySelectorAll('[data-hc]').forEach(function(b){
      b.addEventListener('click',function(){
        fd.color=b.getAttribute('data-hc'); hybCloseMenu(); renderHybSidebar();});});
    m.querySelectorAll('[data-hfa]').forEach(function(b){
      b.addEventListener('click',function(){
        var a=b.getAttribute('data-hfa'); hybCloseMenu();

        /* deleting a folder keeps its contents — they go back to the top level */
        hybFolders=hybFolders.filter(function(f){return f.id!==id;});
        renderHybSidebar();
        toast('“'+fd.name+'” removed. Its '+fd.keys.length+' shortcut'
          +(fd.keys.length===1?'':'s')+' moved back to the list.');});});
  });
}

/* ---- drag a shortcut into a folder, or back out to the top level ---- */
var hybDrag=null;
function wireHybFolders(){
  var wrap=$('#hsbShort'); if(!wrap) return;
  wrap.querySelectorAll('[data-hfoldtog]').forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation();
      var fd=hybFolders.filter(function(f){return f.id===b.getAttribute('data-hfoldtog');})[0];
      if(!fd) return;
      /* collapsed, the folder icon is the only thing left of this section — clicking it
         opens the rail back up with that folder expanded, rather than toggling contents
         nobody can see */
      if(hybState.collapsed){ hybSetCollapsed(false); fd.open=true; renderHybSidebar(); return; }
      fd.open=!fd.open; renderHybSidebar();});});
  wrap.querySelectorAll('[data-hfoldcol]').forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation();
      hybColourMenu(b, b.getAttribute('data-hfoldcol'));});});
  wrap.querySelectorAll('[data-hfoldadd]').forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation();
      view={name:'resources'}; renderView(); window.scrollTo(0,0);});});

  wrap.querySelectorAll('.hfav-row').forEach(function(row){
    row.addEventListener('dragstart',function(e){
      hybDrag=row.getAttribute('data-hkey');
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain', hybDrag); }catch(err){}});
    row.addEventListener('dragend',function(){ row.classList.remove('dragging'); hybDrag=null; });
  });
  wrap.querySelectorAll('[data-hfoldid]').forEach(function(fw){
    fw.addEventListener('dragover',function(e){ e.preventDefault(); e.stopPropagation();
      fw.classList.add('drag-over'); });
    fw.addEventListener('dragleave',function(){ fw.classList.remove('drag-over'); });
    fw.addEventListener('drop',function(e){
      e.preventDefault(); e.stopPropagation(); fw.classList.remove('drag-over');
      var k=hybDrag||e.dataTransfer.getData('text/plain'); if(!k) return;
      var fd=hybFolders.filter(function(f){return f.id===fw.getAttribute('data-hfoldid');})[0];
      if(!fd || fd.auto) return;      /* the recents folder is computed — nothing files into it */
      hybFoldRemove(k); fd.keys.push(k); fd.open=true;
      renderHybSidebar();});
  });
  wrap.addEventListener('dragover',function(e){ e.preventDefault(); wrap.classList.add('drop-root'); });
  wrap.addEventListener('dragleave',function(e){ if(e.target===wrap) wrap.classList.remove('drop-root'); });
  wrap.addEventListener('drop',function(e){
    e.preventDefault(); wrap.classList.remove('drop-root');
    var k=hybDrag||e.dataTransfer.getData('text/plain');
    if(k && hybFolderOf(k)){ hybFoldRemove(k); renderHybSidebar(); }});
}

/* ---- the manage modal: every shortcut, grouped under its folder ---- */
function openFavManage(){
  hybSeedFolders();
  var favs=looseFavs(), byKey={};
  favs.forEach(function(f){ byKey[favKeyOf(f)]=f; });
  var body='';
  hybFolders.forEach(function(fd){
    if(fd.auto) return;          /* nothing in here is arranged, so nothing to arrange */
    body+='<div class="fm-fold" style="--fc:'+fd.color+'"><span class="tico">'+HI.folderFill+'</span>'
      +'<span class="nm">'+esc(fd.name)+'</span>'
      +'<button class="fm-del" data-fmdf="'+fd.id+'" aria-label="Remove '+esc(fd.name)+'">'+HI.trash+'</button></div>';
    fd.keys.forEach(function(k){
      if(byKey[k]) body+=fmRow(byKey[k], true); });
  });
  favs.forEach(function(f){ if(!hybFolderOf(favKeyOf(f))) body+=fmRow(f,false); });
  if(!favs.length && !hybFolders.length) body='<p class="pempty">Ingen snarveier ennå.</p>';

  var sheet=$('#sheet');
  sheet.innerHTML='<div class="sheetbox" role="dialog" aria-modal="true" aria-label="Rediger snarveier"'
   +' style="width:min(470px,100%)">'
   +'<div class="sheethead"><h2>Rediger snarveier</h2>'
   +'<button class="iconbtn" id="fmX" title="Lukk" aria-label="Lukk">'+I.x+'</button></div>'
   +'<div class="sheetbody"><div class="fm-list">'+body+'</div></div>'
   +'<div class="sheetfoot"><span class="cnt">Å fjerne en snarvei tar bort favoritten overalt</span>'
   +'<button class="btn primary" id="fmDone">Done</button></div></div>';
  sheet.hidden=false;
  var close=function(){ sheet.hidden=true; sheet.innerHTML=''; renderHybSidebar(); syncFav(); };
  $('#fmX').addEventListener('click', close);
  $('#fmDone').addEventListener('click', close);
  sheet.addEventListener('mousedown',function(e){ if(e.target===sheet) close(); });
  sheet.querySelectorAll('[data-fmdf]').forEach(function(b){
    b.addEventListener('click',function(){
      hybFolders=hybFolders.filter(function(f){return f.id!==b.getAttribute('data-fmdf');});
      openFavManage();});});
  sheet.querySelectorAll('[data-fmk]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-fmk'), f=byKey[k];
      if(!f) return;
      if(f.src==='res') delete resFav[f.key];
      else if(f.src==='page') delete pageFav[f.key];
      else delete favSet[f.key];
      hybFoldRemove(k); syncFav(); openFavManage();});});
}

/* the quick filters are coarser than the categories, so a category maps to the filter
   that contains it */
function catToFilter(cat){
  var FS=resFilters();
  for(var i=0;i<FS.length;i++){
    var f=FS[i];
    if(f[1] && f[1]!=='fav' && f[1].indexOf(cat)>-1) return f[0];
  }
  return 'Alle';
}

/* ---- the three sidebar overflow menus ---- */
function hybMenu(btn, html, wire){
  var m=$('#ovm');
  if(!m.hidden && m.getAttribute('data-for')===btn.id){ hybCloseMenu(); return; }
  hybCloseMenu();
  m.setAttribute('data-for', btn.id);
  m.innerHTML=html; m.hidden=false;
  var r=btn.getBoundingClientRect();
  m.style.top=(r.bottom+6)+'px';
  m.style.left=Math.max(8,Math.min(r.left, window.innerWidth-m.offsetWidth-8))+'px';
  btn.setAttribute('aria-expanded','true');
  if(wire) wire(m);
}
function hybCloseMenu(){
  var m=$('#ovm'); if(!m) return;
  m.hidden=true; m.removeAttribute('data-for');

   gets a working copy of its seed list the first time it is asked for. Edits then

function wireHybTasks(mod){
  var pg=$('#page'), add=$('#hAddTask');
  if(add) add.addEventListener('click',function(){
    hybAddingTask=!hybAddingTask; renderView();});
  var inp=$('#hNewTask');
  if(inp){
    /* re-rendering detaches the input, which fires blur — settle guards against the
       second call so Enter, the button and blur cannot each add the same task. */
    var settled=false;
    var settle=function(save){
      if(settled) return; settled=true;
      var v=save ? inp.value.trim() : '';
      if(v) hybTasks().unshift({t:v, mod:mod||null, due:'Ingen forfallsdato', pr:'middels'});
      hybAddingTask=false; renderView();
      if(v) toast('Oppgave lagt til.');
    };
    inp.focus();
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ e.preventDefault(); settle(true); }
      else if(e.key==='Escape'){ e.preventDefault(); settle(false); }});
    var ok=$('#hNewTaskOk'); if(ok) ok.addEventListener('mousedown',function(e){
      e.preventDefault(); settle(true);});
    inp.addEventListener('blur',function(){ settle(true); });
  }
  pg.querySelectorAll('[data-tdone]').forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation();
      var t=hybTasks()[+b.getAttribute('data-tdone')];
      if(t){ t.done=!t.done; renderView(); }});});
  pg.querySelectorAll('[data-tpr]').forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation();
      hybPrioMenu(b, +b.getAttribute('data-tpr'));});});
}

  });
}

/* ============ Traditional concept ================================================
   No side menu. Two dropdowns in the top bar carry everything: the burger holds the
   app-level destinations, the modules and the profile; a second pill appears beside it
   once you are inside a module and holds that module's own contents. Below the bar is
   the same #page the other concepts render into, so the dashboard, the module landing
   pages and Resources are shared unchanged — only the way in differs, which is the
   whole point of the comparison.

   Deliberately no search field, per the test design. Cmd/Ctrl+K still opens the same
   overlay: Taif's call, on the grounds that a real ERP keeps the shortcut. ======== */
var TI = {
  /* lucide, verbatim — the burger and the two dropdown carets */
  menu:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16" /> <path d="M4 12h16" /> <path d="M4 19h16" /></svg>',
  chevDown:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>',
  /* lucide chevrons-up-down — the bottom bar's two pills open upward, so a single
     down-caret would point the wrong way */
  chevUD:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5" /> <path d="m7 9 5-5 5 5" /></svg>'
};
/* Which module the bar is scoped to. Set when you open a module and KEPT while you are
   inside it — opening a resource from the module menu must not take the menu away, or
   the menu disappears the moment it is used. Oversikt and Ressurser clear it. */
var tradMod = null;
function tradSyncMod(){

/* ---- the module menu: everything inside one module ----
   Flat half is the module landing page plus its named sub-pages — the same three rows
   Hybrid's tree shows. Cascading half is the seven resource categories. Nothing in the
   data is uncategorised, so the flat half is the sub-pages rather than loose resources.

   No icons in here, Taif's call: the burger is a short list of unlike destinations, where
   an icon tells them apart at a glance, but this menu is one long run of same-kind rows
   where a column of glyphs is noise. tradRow() draws the icon gutter only when a row has

function openTradModMenu(){

  var here=function(n){ return view.name==='asset' && view.item && view.item.n===n; };
  m.innerHTML =
     /* the module's own name, not "Oversikt" — Taif's call, 5 Oct. One word was doing two
        jobs: the dashboard in every breadcrumb, and the landing page of whichever module
        you happened to be in. The trail already reads Oversikt / Regnskap, so the row that
        goes to Regnskap's landing page says Regnskap. */
     tradRow('data-tmodhome="1"', '', mod,
       {active:view.name==='hmod' && view.mod===mod})
   + tradPagesFor(mod).map(function(sub){
       return tradRow('data-tsubpage="'+esc(sub)+'"', '', sub, {active:here(sub)});}).join('')
   + (cats.length?'<hr>':'')
   + cats.map(function(c){
       return tradRow('data-tcat="'+esc(c)+'"', '', c, {cascade:1});}).join('');
  placeTradMenu(m, $('#tModBtn'));

function showTradCascade(btn, cat){

    return tradRow('data-tres="'+esc(r.n)+'"', '', r.n,
      {active:view.name==='asset' && view.item && view.item.n===r.n});}).join('');
  sub.hidden=false;
  var mr=m.getBoundingClientRect(), br=btn.getBoundingClientRect();
  var w=sub.offsetWidth, h=sub.offsetHeight;
  var left=mr.right+6;
  if(left+w > window.innerWidth-8) left=Math.max(8, mr.left-w-6);   /* flip to the left */
  sub.style.left=left+'px';
  sub.style.top=Math.max(8, Math.min(br.top-6, window.innerHeight-h-8))+'px';
  m.querySelectorAll('[data-tcat]').forEach(function(b){
    b.setAttribute('aria-expanded', b===btn ? 'true':'false');});

    b.addEventListener('click',function(){
      var n=b.getAttribute('data-tres'); closeTradMenus();

  /* Cascades open on click and, after a short dwell, on hover — the hover is what makes
     it feel like a desktop ERP menu, the click is what makes it reliable on a trackpad
     over a video call. Moving onto any non-cascade row closes the open one. */
  var dwell=null;
  m.querySelectorAll('[data-tcat]').forEach(function(b){

        if(sub.hidden || sub.getAttribute('data-for')!==cat) showTradCascade(b,cat);},180);});
    b.addEventListener('mouseleave',function(){ clearTimeout(dwell); });});

       library — the Ressurser page, Nylig åpnet, or either favourites list — it sits
       under Ressurser, which is also the way back to its siblings. Reached any other way,
       including search, it names the module it belongs to. view.from carries the route;
       tabs carry their own copy, so switching between two open resources can show two

/* Traditional's trail is the path you actually walked — Taif's call, 24 Sep. It is not
   pathTrail(): that one asks what a resource IS (which module it belongs to, or whether it
   came out of the library), which is the right question in Menu-less, where there is no
   module menu to walk through. Here there is, so the trail answers where you WERE: the
   container you came from, recorded on the view when you opened it.
   Concretely: Regnskap → a resource gives Oversikt / Regnskap / <name>, and the same
   resource reached from Ressurser gives Oversikt / Ressurser / <name>.
   Drawn as spans — **none of it is clickable** — because Traditional already has two
   dropdowns and a bottom bar to move with, and a crumb that looks like a link and is not
   one would be worse than a crumb that plainly is not. */
/* No root crumb — Taif's call, 5 Oct. "Oversikt" led every trail in this concept, which
   made the first crumb the same word on every screen and pushed the part that actually
   says where you are one step to the right. The dashboard now has no trail at all, which
   is honest: there is nowhere above it. */
function tradTrail(){
  if(view.name==='resources') return [{label:'Ressurser'}];
  if(view.name==='hmod')      return [{label:view.mod}];
  if(view.name==='asset'){
    var t=[];
    if(view.path) t.push({label:view.path.label});
    t.push({label:view.item.n});
    return t;
  }
  return [];
}
function renderTradCrumbs(){
  var el=$('#tcrumbs'); if(!el) return;
  var t=tradTrail();
  /* the divider earns its place only when there is something on both sides of it — on the
     dashboard the trail is empty and the module pill is hidden, so it would have been a
     rule with nothing to separate */
  var vr=el.previousElementSibling;
  if(vr && vr.classList.contains('tvrule')) vr.hidden = !t.length;
  el.innerHTML=t.map(function(c,i){
    return (i?'<span class="topsep" aria-hidden="true">/</span>':'')
      +'<span class="topcrumb'+(i===t.length-1?' here':'')+'" title="'+esc(c.label)+'">'
      +esc(c.label)+'</span>';}).join('');
}
function renderTradTop(){

/* ---- mounting: one shell at a time, and #page moves between them ---- */
function mountConcept(){
  /* the panel belongs to Menu-less's bar; leaving that concept with it open would strand
     it over a bar that no longer has the button it is anchored to */
  if(settings.concept!=='menuless') closeMlFavPop();
  var hyb = settings.concept==='hybrid', trad = settings.concept==='traditional',
      ml  = settings.concept==='menuless';
  document.body.classList.toggle('hybrid', hyb);
  document.body.classList.toggle('traditional', trad);
  document.body.classList.toggle('menuless', ml);
  $('#hshell').hidden = !hyb;
  $('#tshell').hidden = !trad;
  $('#mshell').hidden = !ml;
  /* the bar lives outside every shell and is shared by the two concepts that have one.
     Emptied when it is hidden, so Hybrid never holds a stale tab list off screen — which
     is how Reset appeared to leave tabs behind when it had in fact cleared OPEN. */
  $('#tbottom').hidden = !(trad || ml);
  if(!(trad || ml)) $('#ttabs').innerHTML='';
  var page=$('#page'), want = hyb ? $('#hmain') : trad ? $('#tmain') : ml ? $('#mmain') : $('.shell');
  if(page.parentNode!==want) want.appendChild(page);
  /* the search field is one component shared by the concepts — it moves rather than
     being rebuilt, so the overlay, the shortcut and the placeholder stay identical.
     Traditional has no field on screen, so it parks back in the hidden Tailored bar;
     Cmd/Ctrl+K still reaches the overlay, which lives outside every shell. */
  var sw=document.querySelector('.searchwrap'),
      swWant = hyb ? $('#hSearchSlot') : ml ? $('#mSearchSlot') : $('#topbar');
  if(sw && sw.parentNode!==swWant){
    if(hyb || ml) swWant.appendChild(sw);
    else swWant.insertBefore(sw, $('#topbar').querySelector('.tools'));
  }
  if(hyb){ renderHybTop(); renderHybSidebar(); }
  else if(trad){ renderTradTop(); }
  else if(ml){ renderMlTop(); }
  else { centreSearch(); }
}

/* ============ rig: concept + profile switching ============ */
function renderStub(){
  var c=concept();
  $('#page').innerHTML='<div class="stub"><span class="tag">Concept '
   +(CONCEPTS.indexOf(c)+1)+' of '+CONCEPTS.length+' · not built</span>'
   +'<h1>'+esc(c.name)+'</h1><p>'+esc(c.ds)+'</p>'
   +'<p style="margin-top:14px">This concept is a placeholder. Open prototype settings (Shift + P) to switch to a built one.</p></div>';
}
function renderView(){
  var hyb = settings.concept==='hybrid', trad = settings.concept==='traditional',
      ml  = settings.concept==='menuless';
  /* all three built concepts share the dashboard and the module landing pages; only the
     chrome around #page differs */
  var shared = hyb || trad || ml;
  document.body.classList.toggle('resview', view.name==='resources' && settings.concept==='tailored');
  mountConcept();
  if(!shared) renderCrumbs();
  /* every concept that is not built yet lands on the same placeholder */
  if(!concept().built){ renderStub(); syncBar(); return; }
  if(view.name==='resources') renderResources();
  else if(view.name==='asset') renderAsset();
  else if(shared && view.name==='hmod') renderHybModule();
  else if(shared) renderHybHome();
  else if(view.name==='detail') renderDetail(view.cid);
  else renderHome();
  if(hyb) renderHybSidebar();   /* the active row follows the view */
  if(trad) renderTradTop();     /* the module pill follows the view */
  renderResPanel();             /* stays open across navigation; closes itself otherwise */
  if(ml) renderMlTop();         /* the trail and the big buttons follow the view */
}
function applyRig(){
  /* favourites, folders, open tabs and recents all follow the profile AND the concept */
  mountState();
  var p=profile();
  $('#avatar').innerHTML = p.photo ? '<img src="'+AVATAR+'" alt="">'
                                   : '<span class="ini">'+esc(p.initials)+'</span>';
  $('#avatar').title=p.person+' · '+p.role;
  $('#rigState').textContent=concept().name+' · '+p.name;
  document.body.classList.toggle('geo', settings.radius==='geometric');
  $('#rigBtn').hidden=!!settings.hidden;
  if(notesOn!==!!settings.notes) toggleNotes(!!settings.notes);
  syncFav(); renderOpens();   /* module scope changed: the badge and the open tabs follow */
  renderView();
}
function rigOpt(sel,on,name,ds,tag,tagOn){
  return '<button class="rigopt" data-'+sel+' aria-pressed="'+on+'">'
   +'<span class="rigradio"></span>'
   +'<span><span class="nm">'+esc(name)+'</span><span class="ds">'+esc(ds)+'</span></span>'
   +'<span class="rigtag'+(tagOn?' on':'')+'">'+esc(tag)+'</span></button>';
}
function rigTog(key,label,hint,on){
  return '<button class="rigtog" data-tog="'+key+'" aria-pressed="'+on+'">'
   +'<span>'+esc(label)+'<span class="hint">'+esc(hint)+'</span></span><span class="sw"></span></button>';
}
function buildRig(){
  $('#rigBox').innerHTML=
   '<div class="righead"><h2>Prototype settings</h2>'
   +'<button class="rigbtn2" id="rigClose" aria-label="Close">Close</button></div>'
   +'<p class="rigsub">Facilitator only — not part of any concept. Set this up before handing the screen over, '
   +'then switch it off below so the participant cannot reach it.</p>'
   +'<div class="rigsec"><h3>Concept</h3>'
   + CONCEPTS.map(function(c){
       return rigOpt('concept="'+c.id+'"', settings.concept===c.id, c.name, c.ds,
         c.built?'Built':'Placeholder', c.built);}).join('')
   +'</div>'
   /* Corner radius sits under Concept because it is a property of what is on screen
      rather than of who is looking at it. */
   +'<div class="rigsec"><h3>Corner radius</h3>'
   + rigOpt('radius="organic"', settings.radius==='organic', 'Organic',
       'Rounded throughout — the prototype as built', 'Default', settings.radius==='organic')
   + rigOpt('radius="geometric"', settings.radius==='geometric', 'Geometric',
       '0px corners on every component', 'Variant', settings.radius==='geometric')
   +'</div>'
   /* "Profile", not "Test profile" — Taif's call, 25 Sep. The section holds two now, one
      of them called Test, and a heading that repeated the word made the list read as
      though only one of them counted. */
   +'<div class="rigsec"><h3>Profile</h3>'
   + PROFILES.map(function(p){
       return rigOpt('profile="'+p.id+'"', settings.profile===p.id, p.name,
         p.configured? p.person+' · '+p.role+' · '+p.modules.join(', ') : p.ds,
         p.configured?'Ready':'Empty', p.configured);}).join('')
   +'</div>'
   +'<div class="rigsec"><h3>Session</h3>'
   + rigTog('startRes','Default to Resources page','Opens there instead of the dashboard — a build shortcut, off for testing', !!settings.startRes)
   /* Design notes pulled from the rig on 23 Sep, for the shared build: the markers and
      the rationale panel describe the Tailored dashboard, and a colleague opening the
      file would read them as commentary on these three concepts. Nothing is deleted —
      nb(), buildNotes(), toggleNotes() and #notespanel are all still wired. Uncomment
      this row to bring the switch back, and drop the clamp beside the settings loader. */
   // + rigTog('notes','Design notes','Numbered markers and the rationale panel', !!settings.notes)
   + rigTog('hidden','Hide this button','Shift + P brings it back mid-session', !!settings.hidden)
   +'</div>'
   +'<div class="rigfoot"><button class="rigbtn2" id="rigReset">Reset</button>'
   +'<span class="rigkbd" style="margin-left:auto;margin-right:8px">Shift + P opens this'
   +' \u00b7 Shift + R resets</span>'
   +'<button class="rigbtn2 go" id="rigDone">Done</button></div>';

  $('#rigBox').querySelectorAll('[data-concept]').forEach(function(b){
    b.addEventListener('click',function(){
      settings.concept=b.getAttribute('data-concept');
      view={name:'home'}; saveRig(); applyRig(); buildRig();});});
  $('#rigBox').querySelectorAll('[data-radius]').forEach(function(b){
    b.addEventListener('click',function(){
      settings.radius=b.getAttribute('data-radius');
      /* no view reset: the whole value of this switch is seeing the page you are already
         looking at with the other corners on it */
      saveRig(); applyRig(); buildRig();});});
  $('#rigBox').querySelectorAll('[data-profile]').forEach(function(b){
    b.addEventListener('click',function(){
      settings.profile=b.getAttribute('data-profile');
      view={name:'home'}; domain='Alle'; saveRig(); applyRig(); buildRig();});});
  $('#rigBox').querySelectorAll('[data-tog]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-tog');
      settings[k]=!settings[k];
      /* jump there the moment it is switched on, so the effect is visible */
      if(k==='startRes') view={name: settings.startRes?'resources':'home'};
      saveRig(); applyRig(); buildRig();
      if(k==='hidden'&&settings.hidden) closeRig();});});
  $('#rigReset').addEventListener('click',function(){
    resetPrototype(); rigResetToast();});
  $('#rigClose').addEventListener('click',closeRig);
  $('#rigDone').addEventListener('click',closeRig);
}
/* named rather than written twice, and read off the rig afterwards rather than hard-coded
   — it used to say "Traditional · Design" long after Design had stopped being the default,
   and in a per-concept test file it would have named the wrong concept entirely */
function rigResetToast(){
  toast('Nullstilt — '+concept().name+' · '+profile().name
        +', og prototypen er tilbake til utgangspunktet.');
}
function openRig(){ buildRig(); $('#rigScrim').hidden=false; }
function closeRig(){ $('#rigScrim').hidden=true; }
$('#rigBtn').addEventListener('click',openRig);
$('#rigScrim').addEventListener('click',function(e){ if(e.target===$('#rigScrim')) closeRig(); });
document.addEventListener('keydown',function(e){
  var t=document.activeElement, typing=t&&/^(INPUT|TEXTAREA)$/.test(t.tagName);
  if(e.shiftKey && !typing && (e.key==='P'||e.key==='p')){ e.preventDefault();
    if($('#rigScrim').hidden) openRig(); else closeRig(); }
  /* Shift + R resets, without opening the rig first — the thing a facilitator does
     between two participants, and in the test files the rig button is hidden, so this is
     the only way to it that does not cost two keystrokes and a dialog.
     Deliberately not guarded by a confirm, to match the rig's own Reset button. The chord
     is hard to hit by accident and the typing check keeps it out of the search field. */
  if(e.shiftKey && !typing && (e.key==='R'||e.key==='r')){ e.preventDefault();
    resetPrototype(); rigResetToast(); }
  if(e.key==='Escape' && !$('#rigScrim').hidden) closeRig();
});

/* the build shortcut only decides where the session starts, not where you stay */
/* TRIAL: the page header, its back button and its favourite star are hidden because the
   breadcrumb now carries all three. Set this to 0 to put them back. */
var HIDE_PAGE_HEAD = 1;
document.body.classList.toggle('hidehead', !!HIDE_PAGE_HEAD);

/* ---- Per-profile session state -----------------------------------------------------
   Everything a person accumulates — favourites, open tabs, recents, the folders they have
   made — belongs to the person, not to the browser. It used to be global, so switching to
   the Test profile handed a participant the Design profile's nine favourites and two open
   tabs. It is bucketed by profile id now and swapped on the way in and out, the way
   hybTaskStore already was.
   The variables themselves are reassigned rather than emptied, so every reader follows
   without knowing this exists. */
/* ---- Session state: per profile AND per concept -------------------------------------
   Taif's call, 1 Oct. The same participant does the same tasks in all three concepts, so
   nothing they accumulate in one may show up in the next: a favourite added in
   Traditional must not be waiting for them in Menu-less, and neither must the tab they
   pinned or the page they opened ten minutes ago. Each concept has to present the same
   starting point the one before it did.
   So everything accumulated is bucketed by profile|concept — six buckets, one per pair.
   What is in here: favourites of all three kinds, favourited categories and their open
   state, Hybrid's shortcut folders, the open tabs, and the recents sequence.
   The folders have to be in here rather than shared, even though they are Hybrid's alone:
   every unfavourite calls hybFoldRemove(), so with one shared list an unstar in
   Traditional would have quietly pulled a row out of Hybrid's Snarveier while Hybrid
   still had the thing favourited.
   The variables themselves are reassigned rather than emptied, so every reader follows
   without knowing this exists. */
var FSTATE={}, fstateCur=null, FSEED=null;
function fstateGrab(){
  return {resFav:resFav, pageFav:pageFav, favSet:favSet,
          favCats:favCats, favCatOpen:favCatOpen,
          hybFolders:hybFolders, hybFoldSeeded:hybFoldSeeded, hybFoldSeq:hybFoldSeq,
          OPEN:OPEN, recentSeq:recentSeq};
}
function fstatePut(st){
  resFav=st.resFav; pageFav=st.pageFav; favSet=st.favSet;
  favCats=st.favCats; favCatOpen=st.favCatOpen;
  hybFolders=st.hybFolders; hybFoldSeeded=st.hybFoldSeeded; hybFoldSeq=st.hybFoldSeq;
  OPEN=st.OPEN; recentSeq=st.recentSeq;
}
/* A first-time user has none of it — no favourites, no tabs, nothing opened before. The
   one folder is the computed Nylig brukt, which is not something they made: it fills as
   they open things. hybFoldSeeded is true because there is nothing to seed — seeding
   files favourites into folders, and they have none. */
function fstateFresh(){
  return {resFav:{}, pageFav:{}, favSet:{}, favCats:{}, favCatOpen:{},
          hybFolders:[{id:'fr', name:'Nylig brukt', color:HFOLD_COLORS[4],
                       open:false, auto:1, keys:[]}],
          hybFoldSeeded:true, hybFoldSeq:0,
          OPEN:[], recentSeq:[]};
}
/* Every concept starts a configured profile from the same build seed, so the three are
   compared from one baseline rather than from whatever the previous concept was left in.
   A deep copy, or the second concept would share the first one's objects and the split
   would do nothing. */
function mountState(){
  var key=settings.profile+'|'+settings.concept;
  if(fstateCur===key) return;
  if(fstateCur) FSTATE[fstateCur]=fstateGrab();
  var st=FSTATE[key];
  if(!st){
    var p=PROFILES.filter(function(x){return x.id===settings.profile;})[0];
    st = (p && p.fresh) ? fstateFresh() : cl(FSEED);
  }
  FSTATE[key]=st; fstateCur=key; fstatePut(st);
}

/* ---- Reset ------------------------------------------------------------------------
   The rig's Reset used to put back the concept, the profile and the view and nothing
   else, so a second participant inherited the first one's favourites, open tabs, ticked
   tasks, renamed folders, search text and filters. It now restores a snapshot of every
   piece of mutable state, taken here before anyone has touched it.

   A snapshot rather than a list of literals on purpose: state declared above is covered
   the moment it is added to captureSeed(), and there is one place to look. Lazily built
   state (hybState.top, hybState.mod, the seeded folder keys) is null or empty at this
   point, which is exactly right — restoring null makes hybInit() and hybSeedFolders()
   build it again from the data. */
function cl(v){ return v==null ? v : JSON.parse(JSON.stringify(v)); }
function captureSeed(){
  return {
    resFav:cl(resFav), pageFav:cl(pageFav), favSet:cl(favSet),
    favCats:cl(favCats), favCatOpen:cl(favCatOpen),
    favGroupByType:favGroupByType, favMode:favMode,
    OPEN:cl(OPEN), recentSeq:cl(recentSeq),
    hybTaskStore:cl(hybTaskStore), hybState:cl(hybState),
    hybFolders:cl(hybFolders), hybFoldSeeded:hybFoldSeeded, hybFoldSeq:hybFoldSeq,
    tradMod:tradMod, domain:domain, boardView:boardView,
    resModule:resModule, resCat:resCat, resQuery:resQuery, resView:resView,
    resExpanded:resExpanded, resClosedCats:cl(resClosedCats), resShowAll:cl(resShowAll),
    FSTATE:cl(FSTATE)
  };
}
/* The live values at load are the build's, before any concept has been mounted: the nine
   favourites, the two open tabs, the empty recents. They become the seed every
   concept-profile pair copies from. mountState() then swaps in whatever the saved rig
   asks for, and only after that is the reset snapshot taken — so Reset restores the state
   the prototype actually starts in rather than the build's own. */
FSEED=cl(fstateGrab());
mountState();
var RIG_SEED = captureSeed();
function restoreSeed(){
  var S=RIG_SEED; if(!S) return;
  resFav=cl(S.resFav); pageFav=cl(S.pageFav); favSet=cl(S.favSet);
  favCats=cl(S.favCats); favCatOpen=cl(S.favCatOpen);
  favGroupByType=S.favGroupByType; favMode=S.favMode;
  OPEN=cl(S.OPEN); recentSeq=cl(S.recentSeq);
  hybTaskStore=cl(S.hybTaskStore); hybState=cl(S.hybState);
  hybFolders=cl(S.hybFolders); hybFoldSeeded=S.hybFoldSeeded; hybFoldSeq=S.hybFoldSeq;
  tradMod=S.tradMod; domain=S.domain; boardView=S.boardView;
  resModule=S.resModule; resCat=S.resCat; resQuery=S.resQuery; resView=S.resView;
  resExpanded=S.resExpanded; resClosedCats=cl(S.resClosedCats);
  resShowAll=cl(S.resShowAll);
  /* every bucket goes back, and the cursor is cleared so the next mountState() reloads
     the live variables from whichever bucket the reset rig lands on */
  FSTATE=cl(S.FSTATE); fstateCur=null;
}
/* every overlay that lives outside #page and would otherwise survive a re-render */
function closeEverything(){
  closeResPanel();
  ['tmenu','tsub','ovm','favpop','recentpop','boardpop','scrim','sheet','notespanel']
    .forEach(function(id){
    var e=document.getElementById(id); if(e) e.hidden=true; });
  document.querySelectorAll('[aria-haspopup="menu"][aria-expanded="true"]')
    .forEach(function(b){ b.setAttribute('aria-expanded','false'); });
}
function resetPrototype(){
  settings=defaultSettings();
  settings.m54=1; settings.m32=1; settings.m47=1;
  restoreSeed();
  view={name:'home',cid:null};
  closeEverything();
  saveRig(); applyRig(); buildRig();
  window.scrollTo(0,0);
}

if(settings.startRes) view={name:'resources'};
wireHybOnce(); wireTradOnce(); wireMlOnce(); wireResPanelOnce();
renderOpens(); syncFav(); applyRig(); fitBar();

})();
</script>
