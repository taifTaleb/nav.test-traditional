<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP navigasjon – Traditional</title>
<title>ERP Business Platform — Navigasjon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Inter:wght@400;450;500;600&display=swap">
<style>
:root{
  --ground:#F7F1EE; --surface:#FEFCFB; --surface-2:#F4ECE8; --surface-3:#EBDFD9;
  --ink:#2A1614; --ink-2:#6B5652;
  /* --muted was #9C8983, which measured 2.97:1 on --ground — under AA, and it carries
     real content: the dates in the deadline rows, the eyebrow, resource counts, task
     due-dates. Darkened 22 Sep 2026 to the LIGHTEST value on the same hue (14°) and
     saturation (16%) that clears 4.5:1 on every background muted text actually sits on
     — ground 4.78, surface 5.22, card-tint 4.50, surface-2 4.58 — so the quiet tier
     stays as quiet as AA allows and --ink-2 (6.10:1) is still visibly a step darker. */
  --muted:#766863; --faint:#C0ADA7;
  --line:#EDE2DD; --line-2:#DECFC8;
  /* The one neutral grey in an otherwise warm file, and it is deliberate: it is reserved
     for controls that are switched off and cannot be switched on. Taif's call, v27 — a
     sand-toned inert box read as another warm surface rather than as "not available".
     Do not reach for these anywhere else. */
  --dim:#ECECEC; --dim-line:#D4D4D4; --dim-ink:#6E6E6E;
  /* The unfilled star. It was --line-2, which is a hairline colour and measured 1.48:1 on
     --surface — a control you had to know was there. A star is a meaningful graphic, so it
     owes 3:1 under WCAG 1.4.11, not the 1.48 an edge gets away with.
     Derived the way --muted was: the lightest value on the file's hue (14°) and saturation
     (16%) that clears 3:1 on every background a star rests on, hover included — surface
     3.89, ground 3.56, surface-2 3.42, card-tint 3.36, surface-3 3.05. Lighter than
     --muted (5.22) on purpose: seventy-five of these down a list should read as available,
     not as content. Taif's call, 5 Oct. */
  --star-off:#977970;
  --accent:#3D1310; --accent-ink:#FBF3F0; --accent-soft:#EFE1DB;
  --signal:#BE3627; --signal-soft:#F8E5E1;
  --warn:#96520D; --warn-soft:#F6EAD9;
  --good:#2E6A4E;
  --viz-mute:#D3BDB6; --viz-accent:#7C3B2C; --viz-track:#E7D9D3;
  --card-tint:#F2EAE7; --card-edge:#FFFFFF;
  /* resource types. Signal red is deliberately NOT in this set — it is reserved
     for alerts and deadlines, and loses its force if it also marks a row type. */
  --t-action:#3F4E74;  --t-action-bg:#E1E2E7;
  --t-process:#6B3A63; --t-process-bg:#E8DFE4;
  --t-place:#96520D;   --t-place-bg:#EEE2D7;
  --t-asset:#2E6A4E;   --t-asset-bg:#DFE6E1;
  --t-person:#3D1310;  --t-person-bg:#E1D9D8;
  --brand:#FB0A0A;      /* the logo's own red — kept separate from --signal, which means "needs you" */
  --logo:#5A0000;       /* logo at rest */
  --logo-hover:#FB0A0A; /* logo on hover */
  --shadow:0 1px 2px rgba(42,22,20,.04), 0 10px 26px -20px rgba(42,22,20,.2);
  --shadow-lg:0 2px 6px rgba(42,22,20,.06), 0 28px 60px -28px rgba(42,22,20,.35);
  --serif:'Newsreader','Iowan Old Style',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
/* Single-theme by choice — ERP Business Platform does not ship a dark mode. Every token is
   defined once on :root and body paints its own ground, so the page holds its
   look whatever theme the surrounding app is in. */

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
/* padding:0 belongs in this reset. The UA gives every button 1px 6px, and a button that
   sets its own size but not its own padding — an icon square like .bx or .fstar-w — ends
   up with a content box narrower than the glyph, which then sits off to one side. That is
   why the tick in a completed task looked shifted right. Every button here that wants
   padding states it. */
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
ul{margin:0;padding:0;list-style:none}
svg{display:block}
.tnum{font-variant-numeric:tabular-nums}
.shell{min-height:100%;display:flex;flex-direction:column;padding-bottom:64px}

/* ============ top bar — holds the one search field ============ */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:10px;
  padding:14px 22px;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:padding .22s ease, border-color .2s}
.topbar.compact{padding:9px 22px;border-bottom-color:var(--line)}
/* Both side groups take an equal share of whatever is left, so the search field sits
   in the middle of the bar by construction and cannot be moved by the length of the
   trail. The trail lives inside its share and drops crumbs when it runs out. */
.brand{display:flex;align-items:center;gap:8px;flex:1 1 0;min-width:0;overflow:visible}
/* the logo is an icon button like the rest — it only overrides the colour.
   Needs .iconbtn.logo, not .logo: .iconbtn is declared later and would win at equal specificity. */
/* the logo sits on the bar itself: no fill at rest or on hover, the mark's colour
   carries the state. 8px padding keeps the 24px mark inside the round 40x40 button. */
.iconbtn.logo{color:var(--logo);width:40px;height:40px;padding:8px;background:transparent;
  transition:color .18s ease-out}
.iconbtn.logo:hover{color:var(--logo-hover);background:transparent}
/* it lives among the icon buttons now, so it wears their clothes: no border, the same
   surface fill, the same hover. It is the one pill with a word in it, which is what a
   scope selector should be — you need to read the current company, not guess an icon. */
.coswitch{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px 0 15px;border:0;
  border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px;white-space:nowrap;
  flex:none;transition:background .14s,color .14s}
.coswitch:hover{background:var(--surface-3);color:var(--ink)}
.coswitch svg{color:var(--faint)}
.coswitch:hover svg{color:var(--ink-2)}
/* where you are, small and quiet — the current page is the only bold crumb.
   overflow:hidden with non-shrinking crumbs is what makes overflow measurable: the box
   reports a scrollWidth larger than its clientWidth and fitCrumbs sheds a crumb. */
/* flex:none plus a width set by centreSearch(): it must be able to exceed .brand's own
   width to reach into the space beside the field, which max-width alone cannot do */
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;padding-left:8px;overflow:hidden;
  flex-wrap:nowrap;flex:none}
.crumb{font-size:12px;color:var(--muted);white-space:nowrap;flex:none;
  border-radius:6px;padding:3px 5px;display:inline-flex;align-items:center;gap:5px}
/* only the page you are on may ellipse its own text — it is never dropped, so on a very
   long name it has to give somehow. The ellipsis lives on an inner span: text-overflow
   does nothing on a flex container, which is what .crumb is. */
.crumb.here{flex:0 1 auto;min-width:64px;overflow:hidden}
.crumb.here .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crumb.ell{padding:3px 7px;letter-spacing:.06em}
.crumb.link:hover{color:var(--ink);background:var(--surface)}
.crumb.here{color:var(--ink);font-weight:600;cursor:default;padding-left:5px}
.crumbsep{color:var(--faint);flex:none;font-size:12px;line-height:1}
.crumb .crumbcaret{color:var(--faint);opacity:.75;transform:rotate(90deg);flex:none;margin-left:-1px}
.crumb.link:hover .crumbcaret{color:var(--ink-2);opacity:1}
.popcap{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:7px 4px 6px;margin:0 5px 4px;border-bottom:1px solid var(--line-2)}
/* the trail can carry the page's own favourite, so the star travels with "where am I" */
.crumbfav{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--faint);
  flex:none;transition:color .14s,background .14s}
/* 16px was the page-header star; against 12px crumb text it needs to come down a step */
.crumbfav svg{width:13px;height:13px}
.crumbfav:hover{color:var(--ink-2);background:var(--surface)}
.crumbfav.on{color:var(--brand)}
.crumbfav.on:hover{color:var(--brand)}

/* ---- TRIAL: page header hidden, the breadcrumb carries it instead ----------------
   Nothing is deleted — .rhead and .backlink are still rendered and still wired.
   Set HIDE_PAGE_HEAD to 0 in the script to bring them straight back. */
body.hidehead .rhead{display:none}
body.hidehead .detail .backlink{display:none}
body.hidehead .detail{padding-top:4px}

/* width is set by centreSearch() so the two side groups come out equal; the fallbacks
   here are what a narrow, wrapped bar uses */
.searchwrap{flex:0 0 auto;display:flex;justify-content:center;width:560px;max-width:100%;
  min-width:230px;padding:0 6px}
.searchbtn{width:100%;max-width:560px;display:flex;align-items:center;gap:11px;height:46px;padding:0 9px 0 16px;
  border-radius:999px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);
  text-align:left;transition:height .22s ease, max-width .22s ease, border-radius .22s ease}
.topbar.compact .searchbtn{height:40px;max-width:360px;border-radius:999px;box-shadow:none}
.searchbtn:hover{border-color:var(--muted)}
.searchbtn .ph{flex:1;color:var(--muted);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:font-size .22s}
.topbar.compact .searchbtn .ph{font-size:13px}
.kbd{font-size:11px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;line-height:1;flex:none}
.topbar.compact .kbd{display:none}

/* 8/12 padding → 40×32 hit area; under the 40×40 house goal but still past WCAG AA's 24×24 */
.tools{display:flex;align-items:center;gap:8px;flex:none}
.iconbtn{width:40px;height:40px;padding:12px;border-radius:999px;display:grid;place-items:center;
  color:var(--ink-2);background:var(--surface);border:0;position:relative;flex:none}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn.on{background:var(--accent);color:var(--accent-ink)}
.badge{position:absolute;top:4px;right:4px;min-width:15px;height:15px;padding:0 4px;border-radius:999px;
  background:var(--signal);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}
/* One rule hides every notification count in the file, on all four bells — see SHOW_BADGE */
body.nobadge .badge{display:none}
/* the 3px white padding is the inner border */
.avatar{height:40px;width:40px;border-radius:999px;flex:none;background:#fff;padding:3px;border:0;
  display:grid;place-items:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:999px;display:block}
.avatar .ini{font-size:12px;font-weight:600;color:var(--ink-2)}

.pop{position:fixed;z-index:56;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;
  box-shadow:var(--shadow-lg);padding:6px;min-width:216px;max-height:min(440px,62vh);overflow-y:auto}
.pop[hidden]{display:none}
.popitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;
  color:var(--ink-2);text-align:left}
.popitem:hover{background:var(--surface-2);color:var(--ink)}
.popitem svg{color:var(--faint);flex:none}
.popsep{height:1px;background:var(--line);margin:5px 8px}
.pophead{display:flex;align-items:center;gap:10px;padding:9px 10px 11px}
.pophead .pp{width:34px;height:34px;border-radius:999px;background:#fff;padding:2px;flex:none;overflow:hidden;
  display:grid;place-items:center}
.pophead .pp img{width:100%;height:100%;object-fit:cover;border-radius:999px;display:block}
.pophead .pn{font-size:13px;font-weight:600;color:var(--ink);display:block;line-height:1.3}
.pophead .pr{font-size:11.5px;color:var(--muted);display:block}
.popitem.danger{color:var(--signal)}
.popitem.danger svg{color:var(--signal)}
.popitem.danger:hover{background:var(--signal-soft);color:var(--signal)}

/* ============ page ============ */
.page{flex:1;width:100%;max-width:1340px;margin:0 auto;padding:26px 22px 40px}

/* ---- the informational half ------------------------------------------------------
   Below it is the navigational half: cards, shadows, objects you act on. This band is
   deliberately none of those things — flat on the page ground, no surfaces, hairlines
   only inside it. There is no rule under it either: the space does the separating, and
   with the two halves this different a drawn line was saying what the style already
   said. It is kept short on purpose, so the collections are above the fold on a
   laptop. ------------------------------------------------------------------------ */
/* one row, always: greeting | figures | what is coming. When a profile's labels are
   long the label wraps, the layout does not — a column dropping to its own line makes
   the band a third taller and reads as a different dashboard between profiles. */
/* 72 of air on each side: 46 here plus the page's own 26 above, 72 below. Equal gaps
   mean the band is not grouped with either neighbour — it is its own register, which
   is the job the rule used to do before it came out. */
.info{display:flex;flex-wrap:nowrap;align-items:stretch;margin:46px 0 72px;position:relative}
.info-say{flex:1.2 1 250px;min-width:0;padding-right:24px;display:flex;flex-direction:column;
  justify-content:center}
.info-eyebrow{font-size:11.5px;color:var(--muted);letter-spacing:.005em}
/* one line is the budget: the greeting wrapping to two is what pushes the collections
   below the fold, so it is sized to hold "Good afternoon, <name>" without breaking */
.info-say h1{font-family:var(--serif);font-size:clamp(23px,2vw,29px);font-weight:400;line-height:1.14;
  letter-spacing:-.012em;margin:5px 0 0;color:var(--ink);text-wrap:balance}
/* Hybrid's heading is the product name, not a greeting, and it carries the band on its
   own now that the focus line under it is gone — so it gets the weight the old .hhero
   title had. Two lines are expected and fine here: the line the size budget was written
   to protect was the focus line, and this column no longer has one. */
.info-say h1.big{font-size:clamp(28px,2.5vw,38px);line-height:1.06;letter-spacing:-.018em}
/* Hybrid reads title first, then the date and company under it — the product name is
   what that column is for now, where a greeting was what it was for before. The title
   gives up the 5px that separated it from an eyebrow above it, and the eyebrow takes a
   gap of its own instead. */
.info-say.eyebrow-under h1{margin-top:0}
.info-say.eyebrow-under .info-eyebrow{margin-top:8px}
.info-focus{margin-top:6px;font-size:12.5px;line-height:1.5;color:var(--ink-2);max-width:46ch}
.info-focus b{font-weight:600;color:var(--ink)}

/* figures: the same hairline logic as the rest — rules between, never boxes around */
/* Content top-aligned, rules full height. With three dates the figure block and the
   date rows are the same height, so starting them level makes the two columns read as
   one band; stretching the figures keeps their dividers the same length as the two
   outer rules instead of stopping short. */
.info-figs{flex:0 1 auto;min-width:0;display:flex;align-items:stretch;
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
/* 26px matches the gutters either side of the block (.info-say 24, .info-next 24), so
   the figures sit in the same rhythm as the two columns they divide rather than being
   packed tighter than everything around them */
.fig{padding:2px 26px;border-left:1px solid var(--line);min-width:0;flex:0 1 auto;
  display:flex;flex-direction:column;justify-content:flex-start}
.fig:first-child{border-left:0}
/* proportional figures, never tabular — tabular makes a big number look loose */
.fig-val{font-family:var(--serif);font-size:38px;line-height:1.05;letter-spacing:-.015em;
  display:flex;align-items:baseline;gap:5px;color:var(--ink)}
.fig-val .unit{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--muted);
  letter-spacing:.01em;white-space:nowrap}
/* Label and delta each get their own line. Horizontal is the scarce axis here — the
   three columns have to share one row — and vertical is not, so spending 15px of height
   to take ~70px off each figure's width is a good trade. Nothing wraps now: each line
   is short enough to stay whole, so a break can never split "6 past deadline". */
.fig-label{margin-top:5px;font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;
  white-space:nowrap}
.fig-d{display:block;margin-top:2px;font-size:11.5px;font-weight:500;white-space:nowrap}
/* the global reset makes every svg a block; the delta arrow has to go back inline
   or it breaks the label onto a second line and costs the height it was meant to save */
.fig-d svg{display:inline-block;vertical-align:-1.5px;margin-right:1px}
.fig-d.good{color:var(--good)} .fig-d.bad{color:var(--signal)} .fig-d.flat{color:var(--warn)}

/* what is coming: dates that are really navigation, so each row opens the thing */
.info-next{flex:1 1 265px;min-width:0;padding-left:24px;display:flex;flex-direction:column}
.nx-row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;height:28px;flex:none;
  border-bottom:1px solid var(--line);padding:0 4px 0 0;border-radius:5px}
.nx-row:hover{background:var(--surface-2)}
.nx-when{font-size:12px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.nx-row.soon .nx-when{color:var(--signal);font-weight:600}
.nx-dash{color:var(--faint);flex:none}
.nx-what{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.nx-row:not(.soon) .nx-what{color:var(--ink-2)}
.nx-go{color:var(--faint);opacity:0;transition:opacity .13s;display:grid;place-items:center;flex:none}
.nx-row:hover .nx-go{opacity:1}
.nx-all{display:flex;align-items:center;gap:5px;align-self:flex-start;margin-top:7px;padding:3px 6px;
  border-radius:6px;font-size:12px;color:var(--muted)}
.nx-all:hover{color:var(--ink);background:var(--surface-2)}
.nx-all svg{transform:rotate(90deg)}   /* points down: this expands, it does not navigate */

/* Below ~880 the three columns genuinely cannot share a line, so the dates drop to
   their own row and go two-across — the extra row then costs ~60px, not ~130px. */
/* the padding is the first thing to give when the row gets tight — better a snug
   figure than a dropped column */
@media (max-width:1180px){ .fig{padding-left:19px;padding-right:19px} }
@media (max-width:980px){ .fig{padding-left:15px;padding-right:15px} }
@media (max-width:880px){
  .info{flex-wrap:wrap}
  .info-figs{border-right:0}
  .info-next{flex-basis:100%;padding-left:0;margin-top:13px;border-top:1px solid var(--line);
    padding-top:9px;display:grid;grid-template-columns:1fr 1fr;column-gap:24px;align-content:start}
  .nx-all{grid-column:1/-1}
}
@media (max-width:620px){
  .info-next{grid-template-columns:1fr}
}
@media (max-width:760px){
  .info-figs{border-left:0;margin-top:12px;flex-basis:100%}
  .fig{padding-left:0;padding-right:20px;border-left:0}
  .info-say{padding-right:0}
}


/* ---- new collection: a right-hand sheet, not a modal ------------------------------
   Two reasons it is not a centred dialog. The resource picker is a long filtered list
   and wants the full height of the viewport, which a centred box cannot have. And the
   board stays visible behind it — you are adding a collection to that board, so being
   able to see what is already on it is part of deciding what to build. --------------*/
.sheet{position:fixed;inset:0;z-index:78;background:rgba(42,22,20,.26);backdrop-filter:blur(3px);
  display:flex;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheetbox{width:min(548px,100%);height:100%;background:var(--ground);display:flex;flex-direction:column;
  box-shadow:-18px 0 52px rgba(42,22,20,.17);animation:sheetin .26s cubic-bezier(.2,.8,.25,1) both}
@keyframes sheetin{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ .sheetbox{animation:none} }
.sheethead{display:flex;align-items:center;gap:12px;padding:17px 18px 14px;flex:none;
  border-bottom:1px solid var(--line)}
.sheethead h2{font-family:var(--serif);font-size:23px;font-weight:400;flex:1;line-height:1.1}
.sheetbody{flex:1;overflow-y:auto;padding:16px 18px 6px;display:flex;flex-direction:column;min-height:0}
.sheetfoot{flex:none;display:flex;align-items:center;gap:10px;padding:13px 18px;
  border-top:1px solid var(--line);background:var(--surface)}
.sheetfoot .cnt{flex:1;font-size:12px;color:var(--muted)}

.fieldlab{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;display:block}
.tin{width:100%;height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface);font-size:13.5px;color:var(--ink)}
.tin:focus{outline:2px solid var(--accent-soft);outline-offset:-1px;border-color:var(--muted)}

/* the AI route sits above the manual one because it is meant to replace it, not
   supplement it — placeholder in this build */
.aibox{background:var(--accent-soft);border-radius:13px;padding:13px 14px;margin-bottom:6px}
.aibox .aihd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--accent);
  margin-bottom:8px}
.aibox textarea{width:100%;min-height:58px;resize:vertical;padding:9px 11px;border-radius:9px;
  border:1px solid transparent;background:var(--surface);font-family:var(--sans);font-size:13px;
  color:var(--ink);line-height:1.45}
.aibox textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.aibtn{margin-top:9px;height:33px;padding:0 14px;border-radius:9px;background:var(--accent);
  color:var(--accent-ink);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.aibtn:hover{opacity:.92}
.orline{display:flex;align-items:center;gap:12px;margin:18px 0 16px;font-size:11px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.11em;font-weight:600}
.orline i{flex:1;height:1px;background:var(--line-2);display:block}

.fieldrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}
.pickrow{display:flex;gap:8px}
.pick{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line-2);color:var(--ink-2)}
.pick:hover{border-color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
/* the ring sits off the fill, not on it — a border touching the colour reads as a
   darker edge on the swatch rather than as selection */
.swatch{width:29px;height:29px;border-radius:999px;padding:3px;border:1.5px solid transparent}
.swatch i{width:100%;height:100%;border-radius:999px;display:block}
.swatch:hover{border-color:var(--line-2)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}

/* the picker: filters first, then a list that takes whatever height is left */
.pickwrap{margin-top:20px;display:flex;flex-direction:column;flex:1;min-height:260px}
.pickfilters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.sel{height:31px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);
  font-size:12px;color:var(--ink-2);padding:0 7px;font-family:var(--sans)}
.sel:focus{outline:2px solid var(--accent-soft);outline-offset:-1px}
.pickq{flex:1;min-width:120px;height:31px;border-radius:8px;border:1px solid var(--line-2);
  background:var(--surface);font-size:12px;color:var(--ink);padding:0 10px}
.picklist{flex:1;min-height:180px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:4px}
.prow{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;width:100%;
  text-align:left;height:40px;padding:0 9px;border-radius:8px}
.prow:hover{background:var(--surface-2)}
.pbox{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;
  place-items:center;color:transparent;flex:none}
.prow[aria-pressed="true"] .pbox{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prow .pi{color:var(--faint);display:grid;place-items:center}
.prow[aria-pressed="true"] .pi{color:var(--accent)}
.pnm{min-width:0;overflow:hidden}
.pnm b{display:block;font-size:13px;font-weight:400;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pnm span{display:block;font-size:11px;color:var(--muted)}
.pempty{padding:28px 14px;text-align:center;font-size:12.5px;color:var(--muted)}
@media (max-width:600px){ .sheetbox{width:100%} }

.boardhead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.bh-label{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bh-rule{flex:1;height:1px;background:var(--line);min-width:20px}
.segctl{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;flex:none}
.seg{height:27px;padding:0 13px;border-radius:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg:hover{color:var(--ink)}
.seg[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.ico{padding:0 9px;display:grid;place-items:center}
/* matches the selected segment's fill and shadow, and the segctl's outer height */
.boardbtn{height:31px;width:31px;border-radius:9px;background:var(--surface);box-shadow:var(--shadow);
  color:var(--ink-2);display:grid;place-items:center;flex:none}
.boardbtn:hover{color:var(--ink)}
.boardbtn[aria-expanded="true"]{color:var(--ink);background:var(--surface-3);box-shadow:none}
/* the same button with a word in it instead of a glyph — width goes auto, everything
   else (height, radius, surface, shadow, colour) is inherited unchanged */
.boardbtn.lbl{width:auto;padding:0 13px;font-size:12.5px;font-weight:500}

/* ============ board ============ */
/* cards in the same row share a height; the row list absorbs the slack */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:16px;align-items:stretch}
/* one white surface with a hairline edge; the head is separated by a rule rather
   than by an inset panel. The border is what carries the card — a surface step
   alone measures 1.09:1 against the page and does not survive screen sharing. */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:none;padding:0;
  position:relative;display:flex;flex-direction:column;overflow:hidden}
/* list view: one collection per row, full width */
.board.list{grid-template-columns:1fr}
@media (min-width:1080px){
  .card.lead{grid-column:span 2}
  /* a full-width card runs its rows in two columns rather than stretching them */
  .card.wide .rows{display:grid;grid-template-columns:1fr 1fr;align-content:start}
  .card.wide .rows .row{border-bottom:0;border-top:1px solid var(--line)}
  .card.wide .rows .row:nth-child(1),.card.wide .rows .row:nth-child(2){border-top:0}
  .card.wide .rows .row:nth-child(odd){border-right:1px solid var(--line)}
}

.card-head{display:grid;grid-template-columns:1fr auto;gap:13px;align-items:center;padding:18px 17px;
  border-bottom:1px solid var(--line)}
/* mark and meta line are hidden, not removed — restoring them is two rules and
   the grid template above going back to 'auto 1fr auto' */
.card-mark{display:none}
.card-head .prov{display:none}
.card .state{background:var(--surface-2)}
.card-id{min-width:0}
.card-id h2{font-family:var(--serif);font-size:24px;line-height:1.12;letter-spacing:-.006em}
.prov{margin:1px 0 0;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.prov .ptext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{font-size:11.5px;color:var(--accent);text-decoration:underline;text-underline-offset:2px;flex:none;
  opacity:0;transition:opacity .13s}
.card:hover .why,.why:focus-visible{opacity:1}
.headright{display:flex;align-items:center;gap:5px;flex:none}
/* the one state slot — absent entirely when there is no state */
.state{display:flex;align-items:center;gap:6px;height:23px;padding:0 9px;border-radius:7px;font-size:11.5px;
  font-weight:500;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.state.sig{background:var(--signal-soft);color:var(--signal)}
.state.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.sig{background:var(--signal)} .dot.warn{background:var(--warn)}
.dot.good{background:var(--good)} .dot.idle{background:var(--line-2)}
.more{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;color:var(--accent);flex:none;
  opacity:.7;transition:opacity .13s}
.card:hover .more,.more:focus-visible{opacity:1}
.more:hover{background:var(--surface);color:var(--accent)}
.reason{margin:0 4px 8px;padding:9px 11px;border-radius:10px;background:var(--surface);color:var(--ink-2);
  font-size:12.5px;border-left:2px solid var(--accent)}

/* rows keep a fixed height; slack pools at the bottom of the white panel */
.rows{background:none;border-radius:0;flex:1;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:0 17px;
  border-bottom:1px solid var(--line);cursor:pointer;position:relative;height:60px}
.rows .row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.rt{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--faint);flex:none}
/* Every type carries its own colour. Actions still get the extra weight, but from
   the HANDLING tag rather than from red — red would read as an error and scare
   people off the very rows they are meant to use. */
.row[data-t="action"]  .rt{background:var(--t-action-bg); color:var(--t-action)}
.row[data-t="process"] .rt{background:var(--t-process-bg);color:var(--t-process)}
.row[data-t="place"]   .rt{background:var(--t-place-bg);  color:var(--t-place)}
.row[data-t="asset"]   .rt{background:var(--t-asset-bg);  color:var(--t-asset)}
.row[data-t="person"]  .rt{background:var(--t-person-bg); color:var(--t-person)}
.rtext{min-width:0}
.rname{display:block;font-size:13.5px;font-weight:450;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rright{display:flex;align-items:center;gap:7px;flex:none}
.rtype{display:none;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t-action);
  opacity:.85}
.row[data-t="action"] .rtype{display:inline-block}
.fav,.pin{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--faint);flex:none;
  opacity:0;transition:opacity .13s}
.row:hover .fav,.fav.on,.fav:focus-visible,
.row:hover .pin,.pin.on,.pin:focus-visible{opacity:1}
.fav.on{color:var(--warn)}
/* pin holds position inside this collection; the star puts it in the global favourites bar */
.pin.on{color:var(--ink-2)}
.fav:hover,.pin:hover{background:var(--surface-3);color:var(--ink)}

.card-foot{display:flex;justify-content:flex-end;padding:12px 13px;border-top:1px solid var(--line)}
.viewall{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:4px 8px;border-radius:7px}
.viewall:hover{background:var(--surface);color:var(--ink)}
.emptyboard{grid-column:1/-1;padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px;
  border:1px dashed var(--line-2);border-radius:15px}

/* ============ detail ============ */
.detail{max-width:830px}
.backlink{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;padding:6px 10px 6px 6px;
  border-radius:8px;margin-bottom:20px}
.backlink:hover{background:var(--surface);color:var(--ink)}
.dhead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.dhead h1{font-family:var(--serif);font-size:clamp(30px,4vw,42px);line-height:1.06;letter-spacing:-.014em}
.dmeta{margin:12px 0 0;color:var(--muted);font-size:13px;max-width:62ch}
.dactions{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 4px}
.btn{display:flex;align-items:center;gap:7px;height:35px;padding:0 14px;border-radius:9px;font-size:13px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.btn:hover{border-color:var(--muted);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.9;color:var(--accent-ink)}
.grouphead{display:flex;align-items:center;gap:10px;margin:28px 0 2px}
.grouphead h3{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grouphead i{flex:1;height:1px;background:var(--line)}
.grouphead .ct{font-size:10.5px;color:var(--faint);font-weight:500}
.dlist .row{padding-left:8px;padding-right:8px}
.dlist .row:last-child{border-bottom:1px solid var(--line)}
/* group header already says "Actions" — the per-row tag would be redundant here */
.dlist .rtype{display:none!important}
.libexit{margin-top:30px;padding:17px;border:1px dashed var(--line-2);border-radius:14px;background:var(--surface);
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.libexit p{margin:0;font-size:13px;color:var(--muted);max-width:46ch}

/* ============ search overlay ============ */
.scrim{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--ink) 34%,transparent);
  backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:clamp(16px,7vh,90px) 16px 16px}
.scrim[hidden]{display:none}
.palette{width:100%;max-width:700px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line-2);border-radius:17px;box-shadow:var(--shadow-lg);overflow:hidden}
.pfield{display:flex;align-items:center;gap:12px;padding:0 14px 0 17px;height:60px;border-bottom:1px solid var(--line);flex:none}
.pfield input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--sans);font-size:16px;color:var(--ink);outline:0}
.pfield input::placeholder{color:var(--muted)}
.modehint{font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:4px 8px;white-space:nowrap}
.presults{overflow-y:auto;padding:6px 0 10px}
.ghead{padding:13px 17px 4px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hit{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;width:100%;padding:8px 17px;text-align:left}
.hit:hover{background:var(--surface-2)}
.hit[data-t="action"] .rt{background:var(--accent-soft);color:var(--accent)}
.hitwhere{font-size:11px;color:var(--faint);white-space:nowrap}
.noresult{padding:26px 18px 4px;text-align:center}
.noresult h3{font-family:var(--serif);font-size:22px;margin-bottom:6px}
.noresult p{margin:0 auto;color:var(--muted);font-size:13px;max-width:44ch}
.areas{padding:8px 17px 4px}
.areabar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.areabar span{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.areabar i{flex:1;height:1px;background:var(--line)}
.domain{margin-bottom:15px}
.domain h4{margin:0 0 7px;font-size:12.5px;font-weight:600;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--muted);color:var(--ink);background:var(--surface-2)}
.permnote{padding:2px 17px 13px;font-size:11.5px;color:var(--muted);display:flex;gap:7px;align-items:center}
.pfoot{flex:none;display:flex;flex-wrap:wrap;gap:14px;padding:9px 17px;border-top:1px solid var(--line);
  background:var(--surface-2);font-size:11.5px;color:var(--muted)}
.pfoot b{font-weight:500;color:var(--ink-2)}

/* ============ bottom bar ============ */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:8px 18px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.favbtn{display:flex;align-items:center;gap:8px;height:33px;padding:0 11px 0 15px;border-radius:999px;flex:none;
  background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:450}
.favbtn:hover{opacity:.92}
.favbtn .n{font-size:11px;opacity:.7}
/* the same chevrons the company switcher uses — this is a menu, not a favourite action */
.favchev{display:grid;place-items:center;opacity:.6;margin-left:-2px;flex:none}
/* secondary to the Favourites pill: same height, no fill, icon only */
.recentbtn{width:33px;height:33px;border-radius:999px;display:grid;place-items:center;flex:none;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);
  transition:color .14s,background .14s,border-color .14s}
.recentbtn:hover{color:var(--ink);background:var(--surface-2);border-color:var(--muted)}
.recentbtn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.vrule{width:1px;height:20px;background:var(--line-2);flex:none}
.opens{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0}
.opens::-webkit-scrollbar{display:none}
.opentab{display:flex;align-items:center;gap:8px;height:31px;padding:0 6px 0 11px;border-radius:9px;flex:none;
  background:var(--surface-2);color:var(--ink-2);font-size:12.5px;max-width:225px;border:1px solid transparent}
.opentab:hover{background:var(--surface-3);color:var(--ink)}
.opentab.cur{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.opentab .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opentab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--faint);flex:none}
.opentab .x:hover{background:var(--line-2);color:var(--ink)}
.noopen{font-size:12px;color:var(--faint);padding-left:2px;align-self:center}
/* grows with the viewport instead of a fixed cap, so more fits on a tall screen */
.favpop{position:fixed;left:18px;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:55;
  width:min(368px,calc(100vw - 36px));max-height:calc(100vh - 128px);overflow-y:auto;background:var(--surface);
  border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);padding:0}
.favpop[hidden]{display:none}
/* the list fades out, the panel resizes behind it, the new layout fades back in */
/* the 8px that used to be the panel's own bottom padding — it moved in here so the
   sticky footer below can sit flush against the scrollport's edge */
.favbody{transition:opacity .18s ease-out;padding-bottom:8px}
.favbody.pre{opacity:0}
.favbody.out{opacity:0;transition:opacity .12s ease-in}
.favhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px 10px;
  position:sticky;top:0;background:var(--surface);z-index:3}
.favhead h3{font-family:var(--serif);font-size:20px;font-weight:400;line-height:1.1}
.favtools{display:flex;align-items:center;gap:8px;flex:none}
.favtoggle{height:28px;padding:0 10px;border-radius:7px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);white-space:nowrap}
.favtoggle:hover{color:var(--ink-2);border-color:var(--line-2)}
.favtoggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.favcat{display:flex;align-items:center;gap:9px;width:100%;padding:9px 14px;text-align:left}
.favcat:hover{background:var(--surface-2)}
.favcat .cv{color:var(--faint);display:grid;place-items:center;transition:transform .15s;flex:none}
.favcat[aria-expanded="true"] .cv{transform:rotate(90deg)}
.favcat .ci{color:var(--muted);display:grid;place-items:center;flex:none}
.favcat .cn{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favcat .cs{display:block;font-size:11px;color:var(--muted)}
.favcat .cc{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.favcatlist{background:var(--surface-2);padding:2px 6px 6px}
/* compact: one line per row, no dividers — hover is the only separator */
.favlist{padding:0 6px 4px}
.frow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:0 8px;height:36px;
  cursor:pointer;width:100%;text-align:left;border-radius:8px}
.frow:hover{background:var(--surface-2)}
.favcatlist .frow:hover{background:var(--surface-3)}
.frow .ft{color:var(--faint);display:grid;place-items:center;flex:none}
.frow .fx{min-width:0}
.frow .fn{display:block;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fstar{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--warn);flex:none;
  opacity:0;transition:opacity .12s}
.frow:hover .fstar,.fstar:focus-visible{opacity:1}
.fstar svg{fill:currentColor}
.fstar:hover{background:var(--surface-3)}
.favsep{padding:12px 14px 4px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint)}
/* recents is the favourites panel with one column of content and no controls —
   the only addition is the age on the right, which is the whole point of the list */
.recentpop{left:auto;width:min(340px,calc(100vw - 36px))}
.recentpop .favhead{padding-bottom:8px}
.fwhen{font-size:11px;color:var(--muted);flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.frow:hover .fwhen{color:var(--ink-2)}
/* full: the same masonry idea as the resource manager's grid */
/* the grid needs presence even when sparse — min() keeps it from beating max-height on short screens */
.favpop.full{width:min(1060px,calc(100vw - 36px));min-height:min(780px,calc(100vh - 128px));
  display:flex;flex-direction:column}
/* Full gives the panel a floor it does not fill, so without this the footer floats in the
   middle of the empty half. Compact hugs its content and needs no such thing. */
.favpop.full .favbody{flex:1}

.favgrid{padding:6px 16px 4px}
.favblock{margin:0 0 32px}
.favbtitle{display:flex;align-items:baseline;gap:8px;padding:0 8px 8px;margin-bottom:5px;
  border-bottom:1px solid var(--line-2)}
.favbtitle .t{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.2;
  letter-spacing:-.004em;color:var(--ink);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favbtitle .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.favempty{padding:18px 16px 20px;color:var(--muted);font-size:12.5px;margin:0}
/* The way into the whole library, at the foot of both favourites lists — Menu-less's
   panel and Traditional's menu. It is the one thing in either list that is not a
   favourite, so it is a button rather than one more row: a fill of its own, a centred
   label, and a rule above it.
   Sticky, so a long list scrolls under it instead of carrying it off the bottom. It sits
   in the scrollport rather than below the content, which is why the panel's bottom
   padding had to move onto .favbody — otherwise the button would float 8px up and the
   list would show through the gap. Outside .favbody on purpose in the panel, so it stays
   put while the list cross-fades between Kompakt and Full. */
.favfoot{position:sticky;bottom:0;z-index:4;background:var(--surface);
  padding:8px 10px 10px;border-top:1px solid var(--line)}
.favall{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:36px;
  padding:0 14px;border-radius:9px;background:var(--surface-2);color:var(--ink);
  font-size:13px;font-weight:450;text-align:center}
.favall:hover{background:var(--surface-3)}
/* In Menu-less this is the only way into the library — the big buttons and the page row
   that used to offer the other routes are gone as of 5 Oct — so it carries the accent
   rather than the quiet fill it has in Traditional, where the burger and the bar both
   still lead there. Taif's call: make it more visible. */
.favpop .favall{background:var(--accent);color:var(--accent-ink);font-weight:500;height:38px}
.favpop .favall:hover{background:var(--accent);opacity:.92}
/* Traditional's menu has 6px of its own padding all round, so the footer is pulled out
   to the edges and puts it back inside itself — otherwise the rows scroll past it
   through a 6px slot on either side. */
/* Only the sides bleed out. A negative bottom margin here fought the sticky offset —
   sticky holds the element 0 from the scrollport floor, so the pull-down was cancelled
   and then re-added as a 6px gap. The gap below it now is the menu's own padding, in the
   menu's own surface, which is the footer's surface too: invisible. */
.tmenu .favfoot{margin:0 -6px 0;padding:8px 10px 10px}

/* ============ toast / confirm ============ */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:70;
  background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .18s,translate .18s;translate:0 6px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;translate:0 0}
.confirm{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;
  background:color-mix(in srgb,var(--ink) 40%,transparent)}
.confirm[hidden]{display:none}
.cbox{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;
  box-shadow:var(--shadow-lg);padding:22px}
.cbox .ct-mark{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);
  color:var(--accent);margin-bottom:12px}
.cbox h3{font-family:var(--serif);font-size:22px;margin-bottom:6px}
.cbox p{margin:0 0 18px;color:var(--ink-2);font-size:13px}
.cbtns{display:flex;gap:8px;justify-content:flex-end}

/* ============ facilitator scaffolding ============
   Deliberately not the product's visual language — graphite, not clay — so a
   participant reads it as "not part of the thing I am testing". */
.rig{--rig:#2E2A29; --rig-ink:#F2EFED; --rig-line:#4A4442; --rig-mut:#A79F9C; --rig-hi:#7FB3A3}
.rigbtn{position:fixed;right:16px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:58;
  display:flex;align-items:center;gap:9px;height:32px;padding:0 13px;border-radius:8px;
  background:var(--rig);color:var(--rig-ink);font-size:11.5px;letter-spacing:.02em;
  box-shadow:0 6px 20px -8px rgba(0,0,0,.5);opacity:.82;transition:opacity .15s}
.rigbtn:hover{opacity:1}
.rigbtn[hidden]{display:none}
.rigbtn .st{color:var(--rig-mut)}
.rigscrim{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;
  background:rgba(20,14,13,.5);backdrop-filter:blur(3px)}
.rigscrim[hidden]{display:none}
.rigbox{width:100%;max-width:470px;max-height:100%;overflow-y:auto;background:var(--rig);color:var(--rig-ink);
  border-radius:15px;box-shadow:0 30px 70px -20px rgba(0,0,0,.7);padding:20px 20px 0}
.righead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:3px}
.righead h2{font-family:var(--sans);font-size:16px;font-weight:600}
.rigsub{margin:0 0 16px;font-size:11.5px;color:var(--rig-mut);line-height:1.5}
.rigsec{margin-bottom:16px}
.rigsec>h3{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--rig-mut);
  margin-bottom:7px}
.rigopt{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;width:100%;text-align:left;
  padding:9px 11px;border-radius:9px;border:1px solid var(--rig-line);margin-bottom:5px;color:var(--rig-ink)}
.rigopt:hover{border-color:var(--rig-mut)}
.rigopt[aria-pressed="true"]{border-color:var(--rig-hi);background:rgba(127,179,163,.1)}
.rigradio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--rig-line);display:grid;place-items:center;flex:none}
.rigopt[aria-pressed="true"] .rigradio{border-color:var(--rig-hi)}
.rigopt[aria-pressed="true"] .rigradio::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--rig-hi)}
.rigopt .nm{font-size:13px;display:block}
.rigopt .ds{font-size:11px;color:var(--rig-mut);display:block;margin-top:1px}
.rigtag{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;
  background:var(--rig-line);color:var(--rig-mut);white-space:nowrap}
.rigtag.on{background:rgba(127,179,163,.18);color:var(--rig-hi)}
.rigtog{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:8px 11px;
  border-radius:9px;border:1px solid var(--rig-line);margin-bottom:5px;color:var(--rig-ink);font-size:13px;text-align:left}
.rigtog:hover{border-color:var(--rig-mut)}
.rigtog .sw{width:34px;height:19px;border-radius:99px;background:var(--rig-line);position:relative;flex:none;transition:background .15s}
.rigtog .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--rig-ink);transition:translate .15s}
.rigtog[aria-pressed="true"] .sw{background:var(--rig-hi)}
.rigtog[aria-pressed="true"] .sw::after{translate:15px 0}
.rigtog .hint{font-size:11px;color:var(--rig-mut);display:block;margin-top:1px}
.rigfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 0;
  border-top:1px solid var(--rig-line);position:sticky;bottom:0;background:var(--rig)}
.rigbtn2{height:32px;padding:0 14px;border-radius:8px;font-size:12.5px;border:1px solid var(--rig-line);color:var(--rig-ink)}
.rigbtn2:hover{border-color:var(--rig-mut)}
.rigbtn2.go{background:var(--rig-hi);border-color:var(--rig-hi);color:#10221D;font-weight:500}
.rigkbd{font-size:10.5px;color:var(--rig-mut)}

/* ============ resource manager ============ */
.respage{width:100%}
/* the card already clears the bottom bar, so the page must not add its own tail */
body.resview .shell{padding-bottom:0}
body.resview .page{padding-bottom:0}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
/* back sits on the title row as an icon — the old labelled button cost a whole band */
.backbtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--muted);
  flex:none;margin-left:-7px}
.backbtn:hover{background:var(--surface);color:var(--ink)}
/* the line box is not symmetric around the glyphs — Newsreader reserves descender
   space that "Resources" never uses, so the word rides ~1px high. Nudge it back. */
.rhead h1{font-family:var(--serif);font-size:34px;line-height:1.05;letter-spacing:-.012em;
  position:relative;top:1px}
/* favourite the page itself, so Resources is reachable from the favourites bar anywhere */
.pagestar{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--line-2);
  flex:none;transition:color .15s ease-out}
.pagestar svg{fill:none}
.pagestar:hover{background:var(--surface);color:var(--ink-2)}
.pagestar.on{color:var(--signal)}
.pagestar.on svg{fill:currentColor}
.rmgr-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;padding:0 12px}
.rmgr-top .sp{flex:1;min-width:8px}
/* the wrapper holds the toolbar and the card, so fullscreen can carry both */
.rwrap{display:flex;flex-direction:column;min-height:0}
.rwrap.fs{position:fixed;inset:8px;z-index:59;background:var(--ground);border-radius:20px;padding:12px;
  box-shadow:0 24px 70px -24px rgba(42,22,20,.45);overflow:hidden}
.rwrap.fs .rmgr-top{padding:0 6px;margin-bottom:10px}
.rmgr{background:var(--card-tint);border:1px solid var(--card-edge);border-radius:19px;padding:6px;
  display:flex;flex-direction:column;flex:1;min-height:0}
.rmgr-bar{display:flex;align-items:center;gap:12px;padding:10px 7px 12px;flex-wrap:wrap}
.qf{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.qfbtn{height:32px;padding:0 15px;border-radius:999px;background:var(--surface);color:var(--ink-2);
  font-size:12.5px;border:1.5px solid transparent;white-space:nowrap}
.qfbtn:hover{color:var(--ink)}
.qfbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
/* the count is the chip's own promise: how many rows clicking it gives, under whatever
   module tab and search are already on. Quieter than the label, tabular so the row does
   not jitter as the numbers change under a search. */
.qfn{color:var(--muted);font-variant-numeric:tabular-nums}
.qfbtn[aria-pressed="true"] .qfn{color:var(--ink-2)}
/* a chip that would give nothing says so rather than looking the same as the rest */
.qfbtn.empty{color:var(--faint)}
.qfbtn.empty .qfn{color:var(--faint)}
.rmgr-tools{display:flex;align-items:center;gap:8px;flex:none}
/* the labelled board button with a glyph in front of the word */
#rClearFav{display:flex;align-items:center;gap:7px}
#rClearFav svg{color:var(--muted)}
#rClearFav:hover svg{color:var(--ink-2)}
.rmgr .segctl{background:var(--surface-3)}
.rmgr .seg[aria-pressed="true"]{background:var(--surface)}
.rsearch{display:flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:999px;
  background:var(--surface);width:190px}
.rsearch input{border:0;background:transparent;outline:0;font:inherit;font-size:12.5px;color:var(--ink);
  width:100%;min-width:0}
.rsearch input::placeholder{color:var(--muted)}
.rsearch svg{color:var(--muted);flex:none}
.rmgr-rows{background:var(--surface);border-radius:13px;overflow-y:auto;flex:1;min-height:120px}
.rrow{display:grid;grid-template-columns:auto auto 1fr auto;gap:11px;align-items:center;padding:0 14px;height:50px;
  border-bottom:1px solid var(--line);cursor:pointer}
.rmgr-rows .rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--surface-2)}
/* the star lives here, always visible — this is where favouriting happens */
.rstar{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--star-off);flex:none}
.rstar svg{fill:none}
.rstar.on{color:var(--signal)}
.rstar.on svg{fill:currentColor}
.rstar:hover{background:var(--surface-3);color:var(--ink-2)}
.rgo{color:var(--faint);display:grid;place-items:center}
.rrow:hover .rgo{color:var(--ink-2)}
/* a group header is a list item, but plainly not a resource: tinted, small caps, and it
   sticks. --surface-3 rather than --surface-2: against the list's --surface floor that is
   1.28:1 instead of 1.14:1, and it also stops a header reading like a hovered row, since
   hover is --surface-2. The whole label side is the collapse toggle; the count and the
   overflow menu stay outside it, so the count still says how many are hidden. */
.rgroup{display:flex;align-items:center;gap:6px;padding:0 14px 0 8px;height:34px;
  background:var(--surface-3);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:2}
.gtog{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:100%;border-radius:7px;
  padding:0 6px 0 2px;margin-left:-2px}
.gtog:hover .gl{color:var(--ink)}
.gchev{width:18px;height:18px;display:grid;place-items:center;color:var(--muted);flex:none}
.gchev svg{transition:transform .16s}
.gtog[aria-expanded="true"] .gchev svg{transform:rotate(90deg)}
.rgroup .rt{color:var(--muted);display:grid;place-items:center;flex:none}
.rgroup .gl{flex:1;min-width:0;font-size:10.5px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-2);text-align:left;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
/* --ink-2, not --muted: --muted measures 4.09:1 on --surface-3 and this is a number
   somebody reads, not a decoration */
.rgroup .gn{font-size:10.5px;font-weight:500;color:var(--ink-2);flex:none}
/* ---- grid view: category columns, masonry via CSS multi-column ---- */
.gmenu{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--faint);flex:none;
  opacity:.75}
.gmenu:hover{background:var(--surface-3);color:var(--ink);opacity:1}
.rgroup .gmenu{color:var(--muted);margin-right:-4px}
.rgrid{padding:20px 18px 8px}
.rgblock{margin:0 0 26px}
.rgtitle{display:flex;align-items:baseline;gap:8px;padding:0 8px 7px;margin-bottom:4px;
  border-bottom:1px solid var(--line-2)}
.rgtitle .t{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2;
  letter-spacing:-.004em;color:var(--ink);flex:1}
.rgtitle .n{font-size:11px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.grow{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:8px;cursor:pointer;width:100%}
.grow:hover{background:var(--surface-2)}
.gname{flex:1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-align:left}
.grow:hover .gname{color:var(--ink)}
.gstar{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--star-off);flex:none;
  opacity:0;transition:opacity .12s}
.gstar svg{fill:none}
.grow:hover .gstar,.gstar.on,.gstar:focus-visible{opacity:1}
.gstar.on{color:var(--signal)}
.gstar.on svg{fill:currentColor}
.gstar:hover{background:var(--surface-3);color:var(--ink-2)}
.gmore{margin-top:2px;height:32px;padding:0 8px;font-size:12px;color:var(--accent);border-radius:8px;
  display:flex;align-items:center;gap:6px;width:100%;text-align:left}
.gmore:hover{background:var(--surface-2)}
.mcol{display:flex;flex-direction:column;min-width:0}
.rmgr-empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.rfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 9px 5px;
  font-size:11.5px;color:var(--muted);flex-wrap:wrap}

/* placeholder screen for concepts not built yet */
.stub{max-width:520px;margin:6vh auto 0;text-align:center;padding:36px 26px;background:var(--surface);
  border:1px dashed var(--line-2);border-radius:16px}
.stub h1{font-family:var(--serif);font-size:34px;margin-bottom:8px}
.stub p{margin:0 auto 6px;color:var(--muted);font-size:13.5px;max-width:46ch;line-height:1.6}
.stub .tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;margin-bottom:16px}

/* ============ design notes ============ */
.note{position:absolute;z-index:22;width:19px;height:19px;border-radius:50%;background:var(--signal);color:#fff;
  font-size:10.5px;font-weight:600;display:none;place-items:center;box-shadow:0 0 0 3px var(--ground);cursor:pointer}
body.notes .note{display:grid}
.note.tr{top:-8px;right:-8px} .note.tl{top:-8px;left:-8px}
.notespanel{position:fixed;right:0;top:0;bottom:0;z-index:65;width:min(370px,100vw);background:var(--surface);
  border-left:1px solid var(--line-2);box-shadow:var(--shadow-lg);overflow-y:auto;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.notespanel[hidden]{display:none}
.nphead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.nphead h2{font-family:var(--serif);font-size:26px;line-height:1.1}
.npintro{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.npgroup{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  margin:16px 0 4px;padding-left:10px}
.npitem{display:grid;grid-template-columns:22px 1fr;gap:11px;padding:10px;border-radius:10px;align-items:start}
.npitem.hl{background:var(--accent-soft)}
.npn{width:19px;height:19px;border-radius:50%;background:var(--signal);color:#fff;font-size:10.5px;font-weight:600;
  display:grid;place-items:center;margin-top:1px}
.npitem h4{margin:0 0 2px;font-size:13px;font-weight:600}
.npitem p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.npitem.changed .npn{background:var(--accent);color:var(--accent-ink)}


/* ============ Hybrid concept: shell, sidebar, top bar =============================
   A second app shell that lives beside the Tailored one. Only one is mounted at a
   time and #page moves between them, so every view that already exists — the resource
   manager above all — renders unchanged in either concept.
   Ported from the Hybrid prototype; its palette was already this one, so the tokens
   below are the same variables the rest of the file uses. ========================= */
.hshell{min-height:100vh;display:flex}
.hshell[hidden]{display:none}
body.hybrid .shell{display:none}
/* no bottom bar in Hybrid: favourites live in the sidebar's Shortcuts section and there
   are no open-resource tabs in that concept */
body.hybrid .bottombar{display:none}
body.hybrid{padding-bottom:0}
.hsearch .searchwrap{width:auto!important;flex:0 1 auto;padding:0}
.hsearch .searchbtn{height:38px;max-width:420px}

/* ---- sidebar ---- */
.hsb{flex:none;width:260px;min-width:180px;max-width:420px;background:var(--ground);
  border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;
  height:100vh;overflow:hidden;transition:width .2s cubic-bezier(.16,1,.3,1)}
.hsb.resizing{transition:none;user-select:none}
/* min-width on .hsb would otherwise clamp the collapsed rail back to 180 */
.hsb.collapsed{width:65px;min-width:65px}
/* inside the edge, not hanging off it: .hsb needs overflow:hidden to clip the labels
   when it collapses, and anything at right:-3px would be clipped away with them */
.hsb-grip{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:20;
  background:transparent}
.hsb-grip:hover,.hsb-grip.active{background:var(--accent);opacity:.25}
.hsb-top{display:flex;align-items:center;gap:12px;width:100%;height:58px;border-bottom:1px solid var(--line);
  padding:0 16px;color:var(--ink);flex:none}
.hsb-top:hover{background:var(--row-hover)}
.hsb.collapsed .hsb-top{justify-content:center;padding:16px 0}
.hsb.collapsed .hsb-top .tl{display:none}
.hsb-top .tl{font-size:13.5px;font-weight:600;white-space:nowrap}

.hsb-nav{flex:1 1 auto;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.hsb-nav::-webkit-scrollbar{width:8px}
.hsb-nav::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px}
.hsb hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
.hsb-lab{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:6px 10px 4px}
.hsb.collapsed .hsb-nav{padding:8px 0}
.hsb.collapsed .hsb-lab,.hsb.collapsed .hgh-btn,.hsb.collapsed .trow .label,
.hsb.collapsed .tri-hit,.hsb.collapsed .hsb-foot .label{display:none}
.hsb.collapsed .trow{justify-content:center;padding:0;gap:0}
.hsb.collapsed .trow.child{display:none}
/* Collapsed, Snarveier reduces to its folders: one coloured icon each. A loose
   shortcut has only a generic type icon, so at 65px it would be an unlabelled row that
   says nothing — the folders are the section's structure and the part that still reads. */
.hsb.collapsed #hsbShort > .hfav-row,
.hsb.collapsed .hfold-kids,
.hsb.collapsed .hsb-empty,
.hsb.collapsed .hfold-new{display:none}
.hsb.collapsed .hfold-row{padding:0;justify-content:center}
.hsb.collapsed .hfold-t{flex:0 0 auto;justify-content:center;gap:0}
.hsb.collapsed .hfold-dot-wrap,
.hsb.collapsed .hfold-row .cnt{display:none}

.hgh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 0}
.hgh .hsb-lab{padding-left:10px}
.hgh-btn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted);
  flex:none}
.hgh-btn:hover{background:var(--row-hover);color:var(--ink)}
.hgh-btn[aria-expanded="true"]{background:var(--surface-3);color:var(--ink)}

/* rows: one height, one hover, whatever depth they sit at */
.trow{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:8px;
  color:var(--ink-2);font-size:13px;text-align:left;flex:none}
.trow:hover{background:var(--row-hover);color:var(--ink)}
.trow.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
/* --faint is 1.9:1 on the sidebar ground — legible as a hint, not as an icon. --ink-2
   is 6.1:1, clears the 3:1 minimum for a meaningful graphic with room to spare, and
   matches the row's own text so icon and label read as one thing. */
.trow .tico{flex:none;display:grid;place-items:center;color:var(--ink-2)}
.trow.active .tico{color:var(--accent)}
.trow .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .cnt{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
/* a sub-page has no icon, so its text is indented to sit under the parent's label
   rather than under the parent's icon */
.trow.child{height:31px;padding-left:63px;font-size:12.5px;color:var(--muted)}
.trow.child:hover{color:var(--ink)}
/* folder children are resources, a step quieter than a top-level row but still read */
.trow.child .tico{color:var(--muted)}
/* folder children keep their icons; module sub-pages do not have one to show */
.hfold-kids .trow.child{padding-left:10px}
.tri-hit{width:22px;height:22px;margin-left:-4px;border-radius:6px;display:grid;place-items:center;
  color:var(--faint);flex:none}
.tri-hit:hover{background:var(--surface-3);color:var(--ink)}
.tri-hit svg{transition:transform .16s}
.tri-hit[aria-expanded="true"] svg{transform:rotate(90deg)}
/* With nothing to expand the slot goes too. Kept as a blank 22px gutter it pushed the
   three module rows out of line with Oversikt, Ressurser and Administrasjon above them —
   an indent that used to mean "this one opens" and now meant nothing. The folder row in
   Snarveier keeps its chevron, because that one really does open. */
.tri-hit.empty{display:none}

.hsb-foot{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-top:1px solid var(--line);color:var(--ink-2);font-size:13px}
.hsb-foot .av{width:28px;height:28px;border-radius:999px;background:var(--surface);flex:none;
  display:grid;place-items:center;overflow:hidden;font-size:11px;font-weight:600;color:var(--ink-2)}
.hsb-foot .av img{width:100%;height:100%;object-fit:cover;display:block}
.hsb.collapsed .hsb-foot{justify-content:center;padding:10px 0}

/* overflow menus in the sidebar — the same surface as the rest of the popovers */
.ovm{position:fixed;z-index:60;min-width:214px;background:var(--surface);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;max-height:min(460px,64vh);overflow-y:auto}
.ovm[hidden]{display:none}
.ovm-g{padding:2px 0}
.ovm-g + .ovm-g{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.ovm-row{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:7px;
  font-size:12.5px;color:var(--ink-2);text-align:left}
.ovm-row:hover{background:var(--surface-2);color:var(--ink)}
.ovm-row.destructive{color:var(--signal)}
/* These were native inputs with accent-color, which reads as browser chrome next to
   everything else in the file — and Chrome paints a disabled one as a dark grey block.
   Same recipe as the task box now: a rounded square, border only when off, the accent
   pair with the Lucide check when on. The check is that same icon as a data URI rather
   than a second drawing of it — the only way to put a glyph inside an input's own box. */
.ovm-row input[type="checkbox"]{appearance:none;-webkit-appearance:none;margin:0;
  width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-2);
  background:transparent;flex:none;transition:background-color .12s,border-color .12s}
.ovm-row:hover input[type="checkbox"]:not(:disabled){border-color:var(--muted)}
.ovm-row input[type="checkbox"]:checked{border-color:var(--accent);
  background:var(--accent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23FEFCFB' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/11px no-repeat}
/* locked rows: inert, light rather than the dark block the browser drew, and neutral grey
   rather than sand — a warm inert box reads as one more surface in the palette instead of
   as unavailable. The check is --dim-ink on --dim, 4.32:1, so it still reads as ticked. */
.ovm-row input[type="checkbox"]:disabled{cursor:default;border-color:var(--dim-line)}
.ovm-row input[type="checkbox"]:checked:disabled{border-color:var(--dim-line);
  background:var(--dim) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%236E6E6E' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center/11px no-repeat}
label.ovm-row:has(input:disabled){color:var(--dim-ink);cursor:default}
label.ovm-row:has(input:disabled):hover{background:none}
.ovm-row .tico{color:var(--faint);display:grid;place-items:center;flex:none}
.ovm-row .ck{width:15px;height:15px;flex:none;display:grid;place-items:center;color:var(--accent)}
/* A rule under the header, inset to the menu's own padding, so a group reads as a
   header with rows beneath rather than a small row among equals. The first header sits
   tight to the top; the rest get air above them to separate one group from the last. */
.ovm-lab{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:7px 4px 6px;margin:0 5px 4px;border-bottom:1px solid var(--line-2)}
.ovm-lab + .ovm-g{margin-top:0}
.ovm-g + .ovm-lab{margin-top:8px}
/* the group separator was doing this job badly; the header rule replaces it wherever
   a header is present, and it only remains between two groups with no header between */
.ovm-g + .ovm-g{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}

/* ---- main column + its top bar ---- */
.hmain{flex:1;min-width:0;display:flex;flex-direction:column}
.htop{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;height:58px;
  padding:0 18px;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.htop .sp{flex:1}
.hsearch{flex:0 1 auto;display:flex;justify-content:center;min-width:200px}
.orgbtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 11px 0 13px;border-radius:999px;
  background:var(--surface);color:var(--ink-2);font-size:13px;white-space:nowrap;flex:none}
.orgbtn:hover{background:var(--surface-3);color:var(--ink)}
.orgbtn svg{color:var(--faint)}
.orgbtn[aria-expanded="true"]{background:var(--surface-3);color:var(--ink)}

/* ---- Shortcuts folders ---- */
.hsb-empty{font-size:12px;color:var(--muted);padding:6px 10px}
.hfold{border-radius:8px}
.hfold.drag-over{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.hfold-row{display:flex;align-items:center;gap:0;padding:0 8px 0 4px}
.hfold-t{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:100%;color:inherit;text-align:left}
.hfold-t .tri-hit{pointer-events:none}
.hfold-row.open .tri-hit svg{transform:rotate(90deg)}
.hfold-row .tico.fold{color:var(--fc,var(--muted))}
.hfold-dot-wrap{position:relative;flex:none;display:grid;place-items:center;width:22px;height:22px}
.hfold-dot{width:11px;height:11px;border-radius:999px;background:var(--fc,var(--muted));
  box-shadow:0 0 0 2px var(--ground);opacity:0;transition:opacity .13s}
.hfold-row:hover .hfold-dot,.hfold-dot:focus-visible{opacity:1}
.hfold-kids{padding-left:16px;border-left:1px solid var(--line);margin:1px 0 3px 17px}
.hfold-empty{display:block;width:100%;text-align:left;font-size:12px;color:var(--muted);
  padding:6px 10px;border-radius:7px}
.hfold-empty:hover{background:var(--row-hover);color:var(--ink)}
.hfav-row.dragging{opacity:.4}
.hsb-nav .drop-root{outline:1px dashed var(--line-2);outline-offset:-2px;border-radius:8px}
.hfold-new{display:flex;align-items:center;gap:8px;padding:0 10px;height:34px}
.hfold-new input,.hfold-rename{flex:1;min-width:0;height:26px;border:1px solid var(--accent);border-radius:6px;
  background:var(--surface);color:var(--ink);font-size:13px;padding:0 7px;font-family:var(--sans)}
.hfold-new input:focus,.hfold-rename:focus{outline:none}
.hfold-new .tico{color:var(--muted);display:grid;place-items:center;flex:none}
.hcol-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:4px 9px 8px}
.hcol{width:22px;height:22px;border-radius:999px;border:2px solid transparent}
.hcol.on{border-color:var(--ink)}
.hcol:hover{border-color:var(--line-2)}
.fm-list{display:flex;flex-direction:column;gap:1px}
.fm-fold{display:flex;align-items:center;gap:8px;padding:10px 8px 6px;font-size:11px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fm-fold .tico{color:var(--fc,var(--muted));display:grid;place-items:center}
/* the name takes the slack, not the icon — nth-of-type(1) picked the icon span and
   pushed the folder name to the right-hand edge */
.fm-fold .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-fold .tico{flex:none}
.fm-row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;font-size:13px;
  color:var(--ink)}
.fm-row:hover{background:var(--surface-2)}
.fm-row.nested{margin-left:18px}
.fm-row .tico{color:var(--faint);display:grid;place-items:center;flex:none}
.fm-row .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-del{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--faint);flex:none}
.fm-del:hover{background:var(--signal-soft);color:var(--signal)}

.hmain .page{padding-top:26px}
/* their resources page header: the title, then the trail under it. The add and
   fullscreen buttons they had there are not repeated — the manager already carries
   its own, and two sets on one screen would be the wrong kind of faithful. */
.hph{margin-bottom:18px}
.hph h1{font-family:var(--serif);font-size:clamp(26px,2.6vw,34px);font-weight:400;line-height:1.1;
  letter-spacing:-.012em;color:var(--ink)}
.hcrumb{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--muted)}
.hcrumb button{color:var(--muted);border-radius:6px;padding:2px 5px}
.hcrumb button:hover{color:var(--ink);background:var(--surface)}
.hcrumb b{color:var(--ink);font-weight:600}


/* ---- Hybrid dashboard ------------------------------------------------------------
   Their layout, kept: hero beside a deadlines card, a strip of process cards, three
   figures, then tasks and favourites side by side. The content is this prototype's,
   driven by the profile the way the Tailored dashboard is. ---------------------- */
@property --pct{ syntax:"<number>"; inherits:true; initial-value:0 }

.hhero{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin-bottom:26px}
.hhero-l{flex:1 1 320px;min-width:0}
.hhero h1{font-family:var(--serif);font-size:clamp(30px,3.4vw,44px);font-weight:400;line-height:1.08;
  letter-spacing:-.018em;color:var(--ink)}
.hhero-meta{margin-top:9px;font-size:12.5px;color:var(--muted)}
.hmodhead{margin-bottom:26px}
.hmodhead h1{font-family:var(--serif);font-size:clamp(28px,3vw,38px);font-weight:400;line-height:1.08;
  letter-spacing:-.015em;color:var(--ink)}
.hmodhead .hhero-meta{margin-top:7px}
.hdl{flex:0 1 360px;min-width:270px;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;box-shadow:var(--shadow);padding:13px 15px 8px}
.hdl h2{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  margin-bottom:6px}
.hdl-row{display:flex;align-items:center;gap:10px;width:100%;height:32px;border-bottom:1px solid var(--line);
  text-align:left;border-radius:6px}
.hdl-row:last-of-type{border-bottom:0}
.hdl-row:hover{background:var(--surface-2)}
.hdl-row .nm{flex:1;min-width:0;font-size:12.5px;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hdl-row .wh{font-size:11.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.hdl-row.soon .wh{color:var(--signal);font-weight:600}

.hstrip{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));margin-bottom:22px}
.hstat{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 12px 14px}
.hstat .ic{width:32px;height:32px;border-radius:999px;flex:none;display:grid;place-items:center}
.hstat .ic.done{background:var(--good-soft,#E4EFE8);color:var(--good)}
/* the ring is the same meter idea as Tailored's, drawn round: fill to --pct, track behind */
.hstat .ic.ring{background:conic-gradient(var(--viz-accent) calc(var(--pct)*1%),var(--viz-track) 0);
  transition:--pct .9s cubic-bezier(.2,.8,.25,1);position:relative}
.hstat .ic.ring::after{content:"";position:absolute;inset:4px;border-radius:999px;background:var(--surface)}
.hstat .bd{flex:1;min-width:0}
.hstat .t{display:block;font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hstat .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.hstat .kb{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--faint);
  flex:none}
.hstat .kb:hover{background:var(--surface-2);color:var(--ink)}

.hfigs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));margin-bottom:26px}
.hfig{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);
  padding:15px 17px 16px;display:flex;flex-direction:column;min-height:168px}
.hfig-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hfig-label{font-size:12px;font-weight:600;color:var(--ink)}
.hfig-d{font-size:11.5px;font-weight:500;white-space:nowrap}
.hfig-d.good{color:var(--good)} .hfig-d.bad{color:var(--signal)} .hfig-d.flat{color:var(--warn)}
.hfig-val{font-family:var(--serif);font-size:34px;line-height:1.06;letter-spacing:-.015em;margin-top:8px;
  display:flex;align-items:baseline;gap:5px;color:var(--ink)}
.hfig-val .u{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--muted)}
.hfig-plot{margin-top:auto;padding-top:12px}
.hdonut{width:112px;height:112px;border-radius:999px;margin:10px auto 0;position:relative;
  background:conic-gradient(var(--viz-accent) calc(var(--pct)*1%),var(--viz-track) 0);
  transition:--pct .9s cubic-bezier(.2,.8,.25,1);display:grid;place-items:center}
.hdonut::after{content:"";position:absolute;inset:13px;border-radius:999px;background:var(--surface)}
.hdonut .v{position:relative;z-index:1;font-family:var(--serif);font-size:25px;color:var(--ink)}
.hbars{display:flex;align-items:flex-end;gap:4px;height:46px}
.hbars i{flex:1;background:var(--viz-mute);border-radius:3px 3px 0 0;height:0;
  transition:height .7s cubic-bezier(.2,.8,.25,1)}
.hbars i.cur{background:var(--viz-accent)}

.htwo{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
/* A panel is never shorter than one holding five rows — Taif's call, 25 Sep. Without a
   floor, a module page with two tasks collapsed to a strip beside a full one, and the pair
   changed shape from page to page; five is enough that they read as the same component
   wherever you land. Written out of its own parts rather than as one number: 14px top
   padding + 38px header + 4px header margin + five 60px rows + 10px bottom padding.
   Slack pools at the bottom, per the row rule — rows keep their height, the panel grows. */
